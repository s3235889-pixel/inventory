<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專業庫存補貨系統</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e67e22;
            --bg: #f4f7f6;
            --success: #27ae60;
            --danger: #e74c3c;
        }
        body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: var(--primary); font-size: 1.4rem; margin-bottom: 20px; }
        
        .mode-switch { display: flex; gap: 10px; margin-bottom: 20px; }
        .mode-btn { flex: 1; padding: 12px; border: 2px solid var(--primary); background: white; color: var(--primary); font-weight: bold; border-radius: 8px; cursor: pointer; }
        .mode-btn.active { background: var(--primary); color: white; }

        .search-box { margin-bottom: 15px; }
        .search-box input { width: 100%; padding: 12px; font-size: 1.1rem; border: 2px solid #bdc3c7; border-radius: 8px; box-sizing: border-box; }

        .category-tab { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 15px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        .tab-btn { padding: 8px 12px; border: 1px solid #ccc; background: #eee; cursor: pointer; border-radius: 5px; font-size: 0.9rem; }
        .tab-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
        
        .item-grid { display: none; grid-template-columns: 1fr; gap: 10px; }
        .item-grid.active { display: grid; }
        .item-row { display: flex; align-items: center; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; background: #fafafa; border-radius: 6px; }
        .item-info { flex: 1; display: flex; flex-direction: column; }
        .item-name { font-size: 1.1rem; font-weight: 500; transition: color 0.2s; }
        .item-name.has-value { color: var(--danger); font-weight: bold; }
        .safety-tag { font-size: 0.75rem; color: #7f8c8d; margin-top: 2px; }
        
        .qty-select { width: 85px; padding: 8px; font-size: 1.1rem; border-radius: 4px; border: 1px solid #ccc; font-weight: bold; }
        .threshold-input { width: 60px; padding: 6px; text-align: center; border: 1px solid #bdc3c7; border-radius: 4px; }

        .settings-section { display: none; }
        .settings-section.active { display: block; }
        .config-card { background: #ecf0f1; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        .config-card button { padding: 10px; font-weight: bold; border-radius: 6px; border: 1px solid #bdc3c7; background: white; cursor: pointer; }

        #resultArea { margin-top: 25px; background: #2c3e50; color: #fff; padding: 15px; border-radius: 8px; display: none; }
        .result-table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #34495e; }
        .result-table th, .result-table td { border: 1px solid #5a6c7d; padding: 10px; text-align: center; font-size: 0.9rem; }
        .need-order { color: #ff7675; font-weight: bold; }
        .order-qty { color: #55efc4; font-weight: bold; font-size: 1.1rem; }

        .controls { margin-top: 25px; display: flex; gap: 10px; }
        .action-btn { flex: 1; padding: 15px; font-size: 1.1rem; border: none; border-radius: 8px; cursor: pointer; color: white; font-weight: bold; }
        .btn-confirm { background: #3498db; }
        .btn-clear { background: #95a5a6; }

        @media (min-width: 600px) { .item-grid { grid-template-columns: 1fr 1fr; gap: 12px; } }
    </style>
</head>
<body>

<div class="container">
    <h1>🏪 門市庫存盤點系統</h1>

    <div class="mode-switch">
        <button id="btnCountMode" class="mode-btn active" onclick="switchMode('count')">📝 開始點貨</button>
        <button id="btnSetMode" class="mode-btn" onclick="switchMode('setting')">⚙️ 設定底數</button>
    </div>
    
    <div id="countSection">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 快速搜尋品項..." oninput="filterItems()">
        </div>
        <div class="category-tab" id="tabs"></div>
        <div id="itemContainers"></div>
        <div class="controls">
            <button class="action-btn btn-clear" onclick="resetForm()">重設數量</button>
            <button class="action-btn btn-confirm" onclick="generateReport()">確認點貨</button>
        </div>
        <div id="resultArea">
            <h3 style="margin:0 0 10px 0;">📋 建議補貨清單</h3>
            <table class="result-table">
                <thead>
                    <tr><th>品項</th><th>現量</th><th>底數</th><th>建議進貨</th></tr>
                </thead>
                <tbody id="summaryTableBody"></tbody>
            </table>
        </div>
    </div>

    <div id="settingSection" class="settings-section">
        <div class="config-card">
            <button onclick="exportSettings()">📥 複製設定代碼</button>
            <button onclick="triggerImport()">📤 貼上設定代碼</button>
            <button onclick="restoreDefaults()" style="background: #e74c3c; color: white; border: none;">🔄 還原預設資料</button>
        </div>
        <div id="settingList" class="item-grid active"></div>
    </div>
</div>

    function getInitialData() {
        try { 
            return JSON.parse(decodeURIComponent(escape(atob(RAW_CODE)))); 
        } catch (e) { 
            console.error("解碼失敗", e);
            return { categories: ["未分類"], itemMap: {}, safetyStocks: {} }; 
        }
    }

    const initialData = getInitialData();

    // 嚴格載入函式：若本地紀錄空白或無資料，強制載入RAW_CODE預設值
    function loadCategories() {
        try {
            const saved = localStorage.getItem('myCategories');
            if (saved) {
                const parsed = JSON.parse(saved);
                if (Array.isArray(parsed) && parsed.length > 0) return parsed;
            }
        } catch(e) {}
        return initialData.categories || ["未分類"];
    }

    function loadItemMap() {
        try {
            const saved = localStorage.getItem('myItemMap');
            if (saved) {
                const parsed = JSON.parse(saved);
                if (typeof parsed === 'object' && parsed !== null && Object.keys(parsed).length > 0) return parsed;
            }
        } catch(e) {}
        return initialData.itemMap || {};
    }

    function loadSafetyStocks() {
        try {
            const saved = localStorage.getItem('mySafetyStocks');
            if (saved) {
                const parsed = JSON.parse(saved);
                if (typeof parsed === 'object' && parsed !== null) return parsed;
            }
        } catch(e) {}
        return initialData.safetyStocks || {};
    }

    let categories = loadCategories();
    let itemMap = loadItemMap();
    let safetyStocks = loadSafetyStocks();
    let currentCounts = {}; 

    // 初始化品項點貨計數
    Object.keys(itemMap).forEach(name => currentCounts[name] = 0);

    function saveData() {
        localStorage.setItem('myCategories', JSON.stringify(categories));
        localStorage.setItem('myItemMap', JSON.stringify(itemMap));
        localStorage.setItem('mySafetyStocks', JSON.stringify(safetyStocks));
    }

    function updateItemCount(selectElement, name) {
        const val = parseInt(selectElement.value);
        currentCounts[name] = val;
        
        const nameEl = selectElement.parentElement.querySelector('.item-name');
        if (val > 0) {
            nameEl.classList.add('has-value');
        } else {
            nameEl.classList.remove('has-value');
        }
    }

    function switchMode(mode) {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        if (mode === 'count') {
            document.getElementById('btnCountMode').classList.add('active');
            document.getElementById('countSection').style.display = 'block';
            document.getElementById('settingSection').style.display = 'none';
            renderCountingView();
        } else {
            document.getElementById('btnSetMode').classList.add('active');
            document.getElementById('countSection').style.display = 'none';
            document.getElementById('settingSection').style.display = 'block';
            renderSettingView();
        }
    }

    function renderCountingView() {
        const tabs = document.getElementById('tabs');
        const container = document.getElementById('itemContainers');
        tabs.innerHTML = ''; container.innerHTML = '';
        
        const items = Object.keys(itemMap);
        const activeCats = categories.filter(c => items.some(i => itemMap[i] === c));

        activeCats.forEach((cat, idx) => {
            const btn = document.createElement('button');
            btn.className = `tab-btn ${idx===0?'active':''}`;
            btn.innerText = cat;
            btn.onclick = () => {
                document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
                document.querySelectorAll('.item-grid').forEach(g=>g.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(`grid-${cat}`).classList.add('active');
            };
            tabs.appendChild(btn);

            const grid = document.createElement('div');
            grid.id = `grid-${cat}`;
            grid.className = `item-grid ${idx===0?'active':''}`;
            
            items.filter(i => itemMap[i] === cat).forEach(name => {
                const row = document.createElement('div');
                row.className = 'item-row';
                const count = currentCounts[name] || 0;
                const safe = safetyStocks[name] || 0;

                let opts = '';
                for(let i=0; i<=100; i++) opts += `<option value="${i}" ${count===i?'selected':''}>${i}</option>`;

                row.innerHTML = `
                    <div class="item-info">
                        <span class="item-name ${count>0?'has-value':''}">${name}</span>
                        <span class="safety-tag">底數: ${safe}</span>
                    </div>
                    <select class="qty-select" onchange="updateItemCount(this, '${name}')">
                        ${opts}
                    </select>
                `;
                grid.appendChild(row);
            });
            container.appendChild(grid);
        });
    }

    function renderSettingView() {
        const list = document.getElementById('settingList');
        list.innerHTML = '';
        const items = Object.keys(itemMap).sort();

        items.forEach(name => {
            const row = document.createElement('div');
            row.className = 'item-row';
            row.innerHTML = `
                <div style="flex:1"><strong>${name}</strong></div>
                <div>
                    底數: <input type="number" class="threshold-input" value="${safetyStocks[name]||0}" 
                           onchange="safetyStocks['${name}']=parseInt(this.value)||0; saveData();">
                </div>
            `;
            list.appendChild(row);
        });
    }

    function generateReport() {
        const tbody = document.getElementById('summaryTableBody');
        tbody.innerHTML = '';
        let hasData = false;

        Object.keys(itemMap).forEach(name => {
            const count = currentCounts[name] || 0;
            const safe = safetyStocks[name] || 0;
            const diff = safe - count;

            if (count > 0 || diff > 0) {
                hasData = true;
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${name}</td>
                    <td>${count}</td>
                    <td>${safe}</td>
                    <td class="${diff > 0 ? 'need-order' : ''}">${diff > 0 ? `<span class="order-qty">補 ${diff}</span>` : '✅'}</td>
                `;
                tbody.appendChild(tr);
            }
        });

        if (!hasData) return alert("請先輸入點貨數量");
        document.getElementById('resultArea').style.display = 'block';
        window.scrollTo(0, document.body.scrollHeight);
    }

    function filterItems() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        document.querySelectorAll('.item-row').forEach(row => {
            const text = row.querySelector('.item-name').innerText.toLowerCase();
            row.style.display = text.includes(q) ? 'flex' : 'none';
        });
    }

    function resetForm() {
        if(confirm('確定清空現有盤點數？')) {
            Object.keys(currentCounts).forEach(k => currentCounts[k] = 0);
            renderCountingView();
            document.getElementById('resultArea').style.display = 'none';
        }
    }

    function exportSettings() {
        const code = btoa(unescape(encodeURIComponent(JSON.stringify({categories, itemMap, safetyStocks}))));
        prompt("請複製下方代碼：", code);
    }

    function triggerImport() {
        const code = prompt("請貼上設定代碼：");
        if(!code) return;
        try {
            const data = JSON.parse(decodeURIComponent(escape(atob(code))));
            categories = data.categories;
            itemMap = data.itemMap;
            safetyStocks = data.safetyStocks || {};
            saveData(); location.reload();
        } catch(e) { alert("代碼無效"); }
    }

    function restoreDefaults() {
        if (confirm("確定要重設並載入原始預設資料嗎？")) {
            localStorage.removeItem('myCategories');
            localStorage.removeItem('myItemMap');
            localStorage.removeItem('mySafetyStocks');
            location.reload();
        }
    }

    renderCountingView();
</script>
</body>
</html>
