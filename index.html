<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雲端盤點管理系統 (AA DataGrid)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tabulator DataGrid CSS & JS -->
  <link href="https://unpkg.com/tabulator-tables@5.5.2/dist/css/tabulator_tailwindcss.min.css" rel="stylesheet">
  <script type="text/javascript" src="https://unpkg.com/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script>
</head>
<body class="bg-slate-100 p-4 md:p-6 min-h-screen">
  <div class="max-w-5xl mx-auto space-y-6">
    <div class="flex justify-between items-center">
      <h1 class="text-2xl font-bold text-gray-800">雲端盤點管理系統</h1>
      <span class="text-xs bg-emerald-100 text-emerald-800 font-semibold px-2.5 py-1 rounded-full">資料庫: AA 試算表</span>
    </div>

    <!-- 區塊 1：管理分類與品項 -->
    <details class="bg-white rounded-xl shadow-md p-4 border border-blue-100">
      <summary class="font-semibold text-blue-600 cursor-pointer flex justify-between items-center">
        <span>⚙️ 分類與品項目錄設定 (items 頁籤)</span>
        <span class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded">點擊展開</span>
      </summary>
      
      <div class="mt-4 pt-3 border-t space-y-4">
        <!-- 功能 A：單獨新增分類 -->
        <div class="bg-gray-50 p-3 rounded-lg border">
          <label class="block text-xs font-bold text-gray-600 mb-2">Step 1：新增獨立分類</label>
          <div class="flex gap-2">
            <input type="text" id="new-single-cat" placeholder="輸入新類別名稱 (例: 拉麵類、甜品類、包裝類)" class="border p-2 rounded w-full">
            <button onclick="addOnlyCategory()" id="btn-add-cat-only" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700 font-medium whitespace-nowrap">建立新分類</button>
          </div>
        </div>

        <!-- 功能 B：單獨新增品項 -->
        <div class="bg-gray-50 p-3 rounded-lg border">
          <label class="block text-xs font-bold text-gray-600 mb-2">Step 2：選擇分類並建立品項</label>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
            <select id="catalog-cat-select" class="border p-2 rounded w-full bg-white">
              <option value="">-- 請先選擇分類 --</option>
            </select>
            <input type="text" id="new-item-name" placeholder="輸入品項名稱 (例: 豚骨高湯)" class="border p-2 rounded w-full">
            <button onclick="addCatalogItem()" id="btn-add-item" class="bg-emerald-600 text-white px-4 py-2 rounded hover:bg-emerald-700 font-medium">新增品項至目錄</button>
          </div>
        </div>
      </div>
    </details>

    <!-- 區塊 2：盤點填報表單 -->
    <div class="bg-white p-6 rounded-xl shadow-md">
      <h2 id="form-title" class="text-lg font-semibold mb-4 text-gray-700">新增盤點紀錄</h2>
      <input type="hidden" id="item-id">
      
      <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
        <!-- 類別篩選 -->
        <div>
          <label class="block text-xs font-bold text-gray-500 mb-1">依類別篩選</label>
          <select id="item-cat" onchange="filterItemDropdown()" class="border p-2 rounded w-full bg-gray-50">
            <option value="">全部類別</option>
          </select>
        </div>

        <!-- 品項選單 -->
        <div>
          <label class="block text-xs font-bold text-gray-500 mb-1">選擇品項</label>
          <select id="item-name-select" class="border p-2 rounded w-full">
            <option value="">載入 AA 目錄中...</option>
          </select>
        </div>

        <!-- 數量 -->
        <div>
          <label class="block text-xs font-bold text-gray-500 mb-1">數量</label>
          <input type="number" id="item-qty" placeholder="數量" class="border p-2 rounded w-full">
        </div>

        <!-- 按鈕 -->
        <div class="flex items-end gap-2">
          <button onclick="saveItem()" id="btn-save" class="bg-blue-600 text-white px-4 py-2 rounded w-full hover:bg-blue-700 font-medium h-[42px]">新增盤點</button>
          <button onclick="resetForm()" id="btn-cancel" class="bg-gray-400 text-white px-3 py-2 rounded hidden hover:bg-gray-500 h-[42px]">取消</button>
        </div>
      </div>
    </div>

    <!-- 區塊 3：DataGrid 表格區域 -->
    <div class="bg-white p-6 rounded-xl shadow-md space-y-4">
      <div class="flex flex-wrap justify-between items-center gap-2">
        <h2 class="text-lg font-semibold text-gray-700">目前盤點 DataGrid 清單</h2>
        <div class="flex gap-2 items-center">
          <!-- DataGrid 全局關鍵字搜尋框 -->
          <input type="text" id="datagrid-search" placeholder="🔍 快速搜尋關鍵字..." class="border text-sm p-1.5 rounded w-48 focus:w-64 transition-all">
          <button onclick="loadAllData()" class="text-sm bg-gray-100 border px-3 py-1.5 rounded hover:bg-gray-200">🔄 重新整理</button>
        </div>
      </div>

      <!-- DataGrid 掛載目標容器 -->
      <div id="datagrid-table" class="rounded-lg border"></div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxfN3kaj0uOC2XFbjFOHAdDIGhFWTSUAn24tHT4q2AJTqjTnm5HyomdOQEXSUJYN3GPgw/exec';

    let rawCatalog = [];
    let inventoryData = [];
    let dataGridTable = null;

    // 初始化頁面與 DataGrid
    window.addEventListener('DOMContentLoaded', () => {
      initDataGrid();
      loadAllData();
    });

    // 初始化 Tabulator DataGrid 表格
    function initDataGrid() {
      dataGridTable = new Tabulator("#datagrid-table", {
        data: [],
        layout: "fitColumns",
        responsiveLayout: "collapse",
        pagination: "local",
        paginationSize: 10,
        paginationSizeSelector: [10, 20, 50],
        placeholder: "AA 目前尚無盤點紀錄",
        columns: [
          { 
            title: "類別", 
            field: "category", 
            widthGrow: 1,
            formatter: (cell) => `<span class="bg-gray-100 text-gray-700 px-2 py-0.5 rounded text-xs border">${cell.getValue() || '未分類'}</span>`
          },
          { 
            title: "品項名稱", 
            field: "itemName", 
            widthGrow: 2,
            formatter: (cell) => `<span class="font-medium text-gray-800">${cell.getValue()}</span>`
          },
          { 
            title: "數量", 
            field: "quantity", 
            widthGrow: 1,
            formatter: (cell) => `<span class="font-semibold text-blue-600">${cell.getValue()}</span>`
          },
          {
            title: "操作",
            field: "id",
            width: 140,
            headerHozAlign: "center",
            hozAlign: "center",
            formatter: (cell) => {
              const rowData = cell.getRow().getData();
              return `
                <button onclick="editItem('${rowData.id}', '${rowData.category}', '${rowData.itemName}', ${rowData.quantity})" class="bg-amber-500 text-white px-2 py-1 rounded text-xs hover:bg-amber-600">修改</button>
                <button onclick="deleteItem('${rowData.id}')" class="bg-red-500 text-white px-2 py-1 rounded text-xs hover:bg-red-600 ml-1">刪除</button>
              `;
            }
          }
        ]
      });

      // 監聽搜尋輸入框事件
      document.getElementById("datagrid-search").addEventListener("keyup", (e) => {
        dataGridTable.setFilter([
          [
            { field: "category", type: "like", value: e.target.value },
            { field: "itemName", type: "like", value: e.target.value }
          ]
        ]);
      });
    }

    async function loadAllData() {
      await fetchCatalog();
      await fetchData();
    }

    // 1. 讀取 items 頁籤
    async function fetchCatalog() {
      const itemSelect = document.getElementById('item-name-select');
      try {
        const res = await fetch(`${API_URL}?action=getCatalog&t=${Date.now()}`);
        const result = await res.json();
        
        if (result.status === 'error') {
          console.error('後端錯誤：', result.message);
          itemSelect.innerHTML = '<option value="">-- 後端權限異常 --</option>';
          return;
        }

        rawCatalog = result.data || [];
        updateCategoryOptions();
        filterItemDropdown();
      } catch (err) {
        console.error('目錄載入失敗', err);
        itemSelect.innerHTML = '<option value="">-- 連線失敗，請重整 --</option>';
      }
    }

    // 2. 讀取 inventory 頁籤並發送給 DataGrid 繪製
    async function fetchData() {
      try {
        const res = await fetch(`${API_URL}?t=${Date.now()}`);
        const result = await res.json();
        inventoryData = result.data || [];
        
        // 更新 DataGrid 表格資料
        if (dataGridTable) {
          dataGridTable.setData(inventoryData);
        }
      } catch (err) {
        console.error('盤點資料載入失敗', err);
      }
    }

    // 更新類別下拉選單
    function updateCategoryOptions() {
      const categories = Array.from(new Set(rawCatalog.map(item => item.category).filter(Boolean)));

      const catSelect = document.getElementById('item-cat');
      const catalogCatSelect = document.getElementById('catalog-cat-select');

      if (categories.length === 0) {
        catSelect.innerHTML = '<option value="">(無類別，請先建立)</option>';
        catalogCatSelect.innerHTML = '<option value="">-- 請先建立分類 --</option>';
        return;
      }

      const buildOptions = (firstText) => `
        <option value="">${firstText}</option>
        ${categories.map(c => `<option value="${c}">${c}</option>`).join('')}
      `;

      catSelect.innerHTML = buildOptions('全部類別');
      catalogCatSelect.innerHTML = buildOptions('-- 請選擇分類 --');
    }

    // 切換品項選單
    function filterItemDropdown() {
      const selectedCat = document.getElementById('item-cat').value;
      const itemSelect = document.getElementById('item-name-select');

      const validItems = rawCatalog.filter(i => i.itemName);

      const filtered = selectedCat 
        ? validItems.filter(i => i.category === selectedCat)
        : validItems;

      if (filtered.length === 0) {
        itemSelect.innerHTML = '<option value="">-- 目前無品項，請先新增 --</option>';
        return;
      }

      itemSelect.innerHTML = '<option value="">-- 請選擇品項 --</option>' +
        filtered.map(i => `<option value="${i.itemName}" data-cat="${i.category}">${i.itemName} (${i.category || '未分類'})</option>`).join('');
    }

    // 單獨建立新分類
    async function addOnlyCategory() {
      const category = document.getElementById('new-single-cat').value.trim();
      const btn = document.getElementById('btn-add-cat-only');

      if (!category) {
        alert('請輸入要建立的分類名稱！');
        return;
      }

      btn.disabled = true;
      btn.innerText = '建立中...';

      try {
        await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'addCategory', category })
        });

        document.getElementById('new-single-cat').value = '';
        await fetchCatalog();
        alert(`已成功建立分類：「${category}」！`);
      } catch (e) {
        alert('建立失敗，請檢查連線。');
      } finally {
        btn.disabled = false;
        btn.innerText = '建立新分類';
      }
    }

    // 單獨建立品項
    async function addCatalogItem() {
      const category = document.getElementById('catalog-cat-select').value;
      const itemName = document.getElementById('new-item-name').value.trim();
      const btn = document.getElementById('btn-add-item');

      if (!category || !itemName) {
        alert('請先選擇分類並輸入品項名稱！');
        return;
      }

      btn.disabled = true;
      btn.innerText = '處理中...';

      try {
        await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'addCatalog', category, itemName })
        });

        document.getElementById('new-item-name').value = '';
        await fetchCatalog();
        alert(`已成功將品項「${itemName}」加入「${category}」分類！`);
      } catch (e) {
        alert('新增失敗，請確認網路連線。');
      } finally {
        btn.disabled = false;
        btn.innerText = '新增品項至目錄';
      }
    }

    // 儲存盤點紀錄
    async function saveItem() {
      const id = document.getElementById('item-id').value;
      const itemSelect = document.getElementById('item-name-select');
      const itemName = itemSelect.value;
      const selectedOption = itemSelect.options[itemSelect.selectedIndex];
      const category = selectedOption ? selectedOption.getAttribute('data-cat') : '';
      const quantity = document.getElementById('item-qty').value;

      if (!itemName || quantity === '') {
        alert('請選擇品項並輸入數量！');
        return;
      }

      const action = id ? 'update' : 'create';
      const payload = { action, id, category: category || '未分類', itemName, quantity };

      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });

      resetForm();
      fetchData();
    }

    function editItem(id, category, name, qty) {
      document.getElementById('item-id').value = id;
      document.getElementById('item-cat').value = category;
      filterItemDropdown();
      document.getElementById('item-name-select').value = name;
      document.getElementById('item-qty').value = qty;

      document.getElementById('form-title').innerText = '修改盤點項目';
      document.getElementById('btn-save').innerText = '儲存變更';
      document.getElementById('btn-cancel').classList.remove('hidden');
    }

    async function deleteItem(id) {
      if (!confirm('確定要刪除這筆資料嗎？')) return;

      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'delete', id })
      });

      fetchData();
    }

    function resetForm() {
      document.getElementById('item-id').value = '';
      document.getElementById('item-cat').value = '';
      filterItemDropdown();
      document.getElementById('item-qty').value = '';
      document.getElementById('form-title').innerText = '新增盤點紀錄';
      document.getElementById('btn-save').innerText = '新增盤點';
      document.getElementById('btn-cancel').classList.add('hidden');
    }
  </script>
</body>
</html>
