<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>連鎖門市雲端盤點系統 (AA)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-4 md:p-6 min-h-screen">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- 頁首與門市切換區 -->
    <div class="bg-indigo-900 text-white p-4 rounded-xl shadow-md flex flex-wrap justify-between items-center gap-4">
      <div>
        <h1 class="text-xl font-bold">雲端盤點管理系統</h1>
        <p class="text-xs text-indigo-200">請先選擇門市，系統將自動載入該門市專屬品項</p>
      </div>
      
      <div class="flex items-center gap-2 bg-indigo-800 p-2 rounded-lg border border-indigo-700">
        <label class="text-xs font-bold text-amber-300 whitespace-nowrap">📍 當前點貨門市：</label>
        <select id="current-store" onchange="onStoreChange()" class="bg-white text-gray-800 font-bold px-3 py-1.5 rounded text-sm focus:outline-none">
          <option value="南京店">南京店</option>
          <option value="仁愛店">仁愛店</option>
          <option value="萬丹店">萬丹店</option>
          <option value="潮州店">潮州店</option>
          <option value="東港店">東港店</option>
          <option value="木崎">木崎</option>
        </select>
      </div>
    </div>

    <!-- 區塊 1：各門市獨立品項目錄管理 -->
    <details class="bg-white rounded-xl shadow-md p-4 border border-blue-100">
      <summary class="font-semibold text-blue-600 cursor-pointer flex justify-between items-center">
        <span>⚙️ 設定「<span class="target-store-text text-indigo-700 font-bold">南京店</span>」專屬分類與商品 (items 頁籤)</span>
        <span class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded">點擊展開</span>
      </summary>
      
      <div class="mt-4 pt-3 border-t space-y-4">
        <!-- 功能 A：新增該門市專屬分類 -->
        <div class="bg-gray-50 p-3 rounded-lg border">
          <label class="block text-xs font-bold text-gray-600 mb-2">Step 1：為「<span class="target-store-text text-indigo-700">南京店</span>」新增獨立分類</label>
          <div class="flex gap-2">
            <input type="text" id="new-single-cat" placeholder="輸入新類別名稱 (例: 特調飲品類、限定餐點類)" class="border p-2 rounded w-full">
            <button onclick="addOnlyCategory()" id="btn-add-cat-only" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700 font-medium whitespace-nowrap">建立門市分類</button>
          </div>
        </div>

        <!-- 功能 B：新增該門市專屬品項 -->
        <div class="bg-gray-50 p-3 rounded-lg border">
          <label class="block text-xs font-bold text-gray-600 mb-2">Step 2：選擇「<span class="target-store-text text-indigo-700">南京店</span>」的分類並建立商品</label>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
            <select id="catalog-cat-select" class="border p-2 rounded w-full bg-white">
              <option value="">-- 請先選擇分類 --</option>
            </select>
            <input type="text" id="new-item-name" placeholder="輸入品項名稱 (例: 限定抹茶冰淇淋)" class="border p-2 rounded w-full">
            <button onclick="addCatalogItem()" id="btn-add-item" class="bg-emerald-600 text-white px-4 py-2 rounded hover:bg-emerald-700 font-medium">新增至門市商品</button>
          </div>
        </div>
      </div>
    </details>

    <!-- 區塊 2：點貨選擇區 -->
    <div class="bg-white p-6 rounded-xl shadow-md">
      <h2 class="text-lg font-semibold mb-4 text-gray-700">1. 選擇商品放入購物車 (<span class="target-store-text text-indigo-700 font-bold">南京店</span>)</h2>
      
      <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
        <div>
          <label class="block text-xs font-bold text-gray-500 mb-1">依類別篩選</label>
          <select id="item-cat" onchange="filterItemDropdown()" class="border p-2 rounded w-full bg-gray-50">
            <option value="">全部類別</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-500 mb-1">選擇商品</label>
          <select id="item-name-select" class="border p-2 rounded w-full">
            <option value="">載入中...</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-500 mb-1">盤點數量</label>
          <input type="number" id="item-qty" placeholder="數量" class="border p-2 rounded w-full" min="1">
        </div>

        <div class="flex items-end">
          <button onclick="addToQueue()" class="bg-amber-500 text-white px-4 py-2 rounded w-full hover:bg-amber-600 font-medium h-[42px] shadow flex justify-center items-center gap-1">
            🛒 放入暫存購物車
          </button>
        </div>
      </div>
    </div>

    <!-- 區塊 3：購物車預覽區 -->
    <div class="bg-amber-50/60 border-2 border-amber-300 p-6 rounded-xl shadow-sm space-y-4">
      <div class="flex flex-wrap justify-between items-center gap-2">
        <div class="flex items-center gap-2">
          <h2 class="text-lg font-bold text-amber-900 flex items-center gap-1">
            🛒 2. 待送出盤點清單 (<span id="display-store-tag" class="text-indigo-700 font-bold">南京店</span>)
          </h2>
          <span id="queue-count" class="bg-amber-200 text-amber-900 text-xs px-2.5 py-0.5 rounded-full font-bold">0 筆項目</span>
        </div>
        
        <div class="flex items-center gap-2">
          <button onclick="clearQueue()" id="btn-clear-queue" class="text-xs bg-white text-gray-600 hover:text-red-600 px-3 py-2 rounded border border-gray-300 transition hidden">
            🗑️ 清空購物車
          </button>
          <button onclick="submitBatch()" id="btn-submit-batch" class="bg-emerald-600 text-white px-5 py-2 rounded-lg hover:bg-emerald-700 font-bold shadow-md transition disabled:opacity-40" disabled>
            🚀 一次性全部送出至雲端
          </button>
        </div>
      </div>

      <div class="overflow-x-auto bg-white rounded-lg border border-amber-200">
        <table class="min-w-full border-collapse">
          <thead>
            <tr class="bg-amber-100/70 text-left text-sm font-semibold text-amber-900 border-b">
              <th class="p-3">類別</th>
              <th class="p-3">品項名稱</th>
              <th class="p-3 w-32">數量 (可直接修改)</th>
              <th class="p-3 text-center w-24">操作</th>
            </tr>
          </thead>
          <tbody id="queue-table-body" class="divide-y divide-gray-100 text-sm text-gray-700">
            <tr><td colspan="4" class="p-4 text-center text-gray-400">目前購物車是空的。</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 區塊 4：歷史叫貨紀錄查詢區 -->
    <div class="bg-white p-6 rounded-xl shadow-md space-y-4">
      <div class="border-b pb-3 flex flex-wrap justify-between items-center gap-3">
        <h2 class="text-lg font-bold text-gray-800">🔍 3. 雲端歷史叫貨紀錄查詢</h2>
        <button onclick="loadAllData()" class="text-xs bg-gray-100 border px-3 py-1.5 rounded hover:bg-gray-200 flex items-center gap-1">🔄 重新整理資料</button>
      </div>

      <!-- 查詢過濾器 -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3 bg-slate-50 p-3 rounded-lg border">
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">📅 選擇叫貨日期</label>
          <input type="date" id="filter-date" onchange="renderTable()" class="border p-2 rounded w-full text-sm bg-white">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">🏪 篩選門市</label>
          <select id="filter-store" onchange="renderTable()" class="border p-2 rounded w-full text-sm bg-white">
            <option value="">全部門市</option>
            <option value="南京店">南京店</option>
            <option value="仁愛店">仁愛店</option>
            <option value="萬丹店">萬丹店</option>
            <option value="潮州店">潮州店</option>
            <option value="東港店">東港店</option>
            <option value="木崎">木崎</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">🏷️ 篩選類別</label>
          <select id="filter-cat" onchange="renderTable()" class="border p-2 rounded w-full text-sm bg-white">
            <option value="">全部類別</option>
          </select>
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="min-w-full border-collapse border border-gray-200">
          <thead>
            <tr class="bg-gray-100 text-left text-sm font-semibold text-gray-600 border-b">
              <th class="p-3">門市</th>
              <th class="p-3">類別</th>
              <th class="p-3">品項名稱</th>
              <th class="p-3">叫貨數量</th>
              <th class="p-3">叫貨/更新時間</th>
              <th class="p-3 text-center">操作</th>
            </tr>
          </thead>
          <tbody id="table-body" class="divide-y divide-gray-200 text-sm text-gray-700">
            <tr><td colspan="6" class="p-4 text-center text-gray-400">資料載入中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbz-MoC5G8gSwk_3qjehTfwCtOrsYiCAAZrwHK571xkz8S6KoiD604wScV4Gkt0QbCHM/exec';

    let rawCatalog = [];
    let inventoryData = [];
    let pendingQueue = [];

    // 當切換選單中的門市時，自動更新文字並過濾該門市專屬品項
    function onStoreChange() {
      const selectedStore = document.getElementById('current-store').value;
      
      // 更新介面上的門市標籤
      document.querySelectorAll('.target-store-text').forEach(el => el.innerText = selectedStore);
      document.getElementById('display-store-tag').innerText = selectedStore;

      // 當切換門市時，若購物車有舊門市的東西，詢問是否清空
      if (pendingQueue.length > 0) {
        if (confirm(`切換門市將會清空目前購物車中的暫存項目，確定要切換為【${selectedStore}】嗎？`)) {
          pendingQueue = [];
          renderQueueTable();
        } else {
          return;
        }
      }

      // 重新依門市刷新目錄與品項
      updateCategoryOptions();
      filterItemDropdown();
    }

    async function loadAllData() {
      await fetchCatalog();
      await fetchData();
    }

    async function fetchCatalog() {
      const itemSelect = document.getElementById('item-name-select');
      try {
        const res = await fetch(`${API_URL}?action=getCatalog&t=${Date.now()}`);
        const result = await res.json();
        
        if (result.status === 'error') {
          itemSelect.innerHTML = '<option value="">-- 後端權限異常 --</option>';
          return;
        }

        rawCatalog = result.data || [];
        updateCategoryOptions();
        filterItemDropdown();
      } catch (err) {
        itemSelect.innerHTML = '<option value="">-- 連線失敗，請重整 --</option>';
      }
    }

    async function fetchData() {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-gray-400">載入最新盤點中...</td></tr>';
      try {
        const res = await fetch(`${API_URL}?t=${Date.now()}`);
        const result = await res.json();
        inventoryData = result.data || [];
        renderTable();
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-red-500">載入失敗，請檢查網路。</td></tr>';
      }
    }

    // 依據「當前選擇的門市」，動態抓取該門市有設立的類別
    function updateCategoryOptions() {
      const currentStore = document.getElementById('current-store').value;
      
      // 只留下屬於「當前門市」的目錄項目
      const storeCatalog = rawCatalog.filter(item => item.store === currentStore || !item.store);
      const categories = Array.from(new Set(storeCatalog.map(item => item.category).filter(Boolean)));

      const catSelect = document.getElementById('item-cat');
      const catalogCatSelect = document.getElementById('catalog-cat-select');
      const filterCat = document.getElementById('filter-cat');

      if (categories.length === 0) {
        catSelect.innerHTML = '<option value="">(此門市尚無類別)</option>';
        catalogCatSelect.innerHTML = '<option value="">-- 無類別，請先建立 --</option>';
      } else {
        const buildOptions = (firstText) => `
          <option value="">${firstText}</option>
          ${categories.map(c => `<option value="${c}">${c}</option>`).join('')}
        `;
        catSelect.innerHTML = buildOptions('全部類別');
        catalogCatSelect.innerHTML = buildOptions('-- 請選擇分類 --');
      }

      // 歷史紀錄的類別過濾器包含所有門市的類別
      const allCategories = Array.from(new Set(rawCatalog.map(item => item.category).filter(Boolean)));
      filterCat.innerHTML = '<option value="">全部類別</option>' + allCategories.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    // 依據「當前門市」與「選取的類別」過濾商品選單
    function filterItemDropdown() {
      const currentStore = document.getElementById('current-store').value;
      const selectedCat = document.getElementById('item-cat').value;
      const itemSelect = document.getElementById('item-name-select');

      // 1. 篩選目前門市的商品
      const storeItems = rawCatalog.filter(i => (i.store === currentStore || !i.store) && i.itemName);

      // 2. 篩選類別
      const filtered = selectedCat 
        ? storeItems.filter(i => i.category === selectedCat)
        : storeItems;

      if (filtered.length === 0) {
        itemSelect.innerHTML = `<option value="">-- 【${currentStore}】尚無專屬商品 --</option>`;
        return;
      }

      itemSelect.innerHTML = '<option value="">-- 請選擇商品 --</option>' +
        filtered.map(i => `<option value="${i.itemName}" data-cat="${i.category}">${i.itemName} (${i.category || '未分類'})</option>`).join('');
    }

    // 購物車暫存邏輯
    function addToQueue() {
      const itemSelect = document.getElementById('item-name-select');
      const itemName = itemSelect.value;
      const selectedOption = itemSelect.options[itemSelect.selectedIndex];
      const category = selectedOption ? selectedOption.getAttribute('data-cat') || '未分類' : '未分類';
      const quantity = document.getElementById('item-qty').value;

      if (!itemName || itemName.startsWith('--')) {
        alert('請先選擇正確的商品！');
        return;
      }

      if (quantity === '' || Number(quantity) < 0) {
        alert('請填寫正確的數量！');
        return;
      }

      const existingIndex = pendingQueue.findIndex(q => q.itemName === itemName && q.category === category);
      if (existingIndex > -1) {
        pendingQueue[existingIndex].quantity = quantity;
      } else {
        pendingQueue.push({ category, itemName, quantity });
      }

      document.getElementById('item-qty').value = '';
      renderQueueTable();
    }

    function renderQueueTable() {
      const tbody = document.getElementById('queue-table-body');
      const submitBtn = document.getElementById('btn-submit-batch');
      const clearBtn = document.getElementById('btn-clear-queue');
      const countLabel = document.getElementById('queue-count');

      countLabel.innerText = `${pendingQueue.length} 筆項目`;
      tbody.innerHTML = '';

      if (pendingQueue.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-400">目前購物車是空的。</td></tr>';
        submitBtn.disabled = true;
        clearBtn.classList.add('hidden');
        return;
      }

      submitBtn.disabled = false;
      clearBtn.classList.remove('hidden');

      pendingQueue.forEach((item, index) => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-amber-50';
        tr.innerHTML = `
          <td class="p-3"><span class="bg-amber-100 text-amber-800 px-2 py-0.5 rounded text-xs font-medium">${item.category}</span></td>
          <td class="p-3 font-medium text-gray-800">${item.itemName}</td>
          <td class="p-3">
            <input type="number" value="${item.quantity}" onchange="updateQueueQty(${index}, this.value)" class="border px-2 py-1 rounded w-20 text-amber-900 font-bold bg-white text-center">
          </td>
          <td class="p-3 text-center">
            <button onclick="removeFromQueue(${index})" class="text-red-500 hover:text-red-700 text-xs bg-red-50 px-2 py-1 rounded border border-red-200">移除</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function updateQueueQty(index, newQty) {
      if (newQty !== '' && Number(newQty) >= 0) {
        pendingQueue[index].quantity = newQty;
      }
    }

    function removeFromQueue(index) {
      pendingQueue.splice(index, 1);
      renderQueueTable();
    }

    function clearQueue() {
      if (confirm('確定要清空整個購物車暫存嗎？')) {
        pendingQueue = [];
        renderQueueTable();
      }
    }

    async function submitBatch() {
      if (pendingQueue.length === 0) return;
      const currentStore = document.getElementById('current-store').value;

      if (!confirm(`確定要將【${currentStore}】的 ${pendingQueue.length} 筆叫貨資料一次性送出嗎？`)) return;

      const submitBtn = document.getElementById('btn-submit-batch');
      submitBtn.disabled = true;
      submitBtn.innerText = '正在寫入雲端...';

      try {
        for (const item of pendingQueue) {
          const payload = {
            action: 'create',
            store: currentStore,
            category: item.category,
            itemName: item.itemName,
            quantity: item.quantity
          };

          await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
          });
        }

        alert(`🎉 【${currentStore}】的所有叫貨項目已成功送出！`);
        pendingQueue = [];
        renderQueueTable();
        fetchData();
      } catch (err) {
        alert('發送過程發生錯誤，請檢查網路連線。');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = '🚀 一次性全部送出至雲端';
      }
    }

    function renderTable() {
      const tbody = document.getElementById('table-body');
      const filterDate = document.getElementById('filter-date').value;
      const filterStore = document.getElementById('filter-store').value;
      const filterCat = document.getElementById('filter-cat').value;

      tbody.innerHTML = '';

      let filteredData = inventoryData;

      if (filterDate) {
        filteredData = filteredData.filter(d => d.updatedAt && d.updatedAt.startsWith(filterDate));
      }
      if (filterStore) {
        filteredData = filteredData.filter(d => d.store === filterStore);
      }
      if (filterCat) {
        filteredData = filteredData.filter(d => d.category === filterCat);
      }

      if (!filteredData || filteredData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-gray-400">查無符合條件的叫貨紀錄</td></tr>';
        return;
      }

      filteredData.forEach(item => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-gray-50';
        tr.innerHTML = `
          <td class="p-3"><span class="bg-indigo-100 text-indigo-800 font-bold px-2 py-0.5 rounded text-xs">${item.store || '未指定'}</span></td>
          <td class="p-3"><span class="bg-gray-100 text-gray-700 px-2 py-0.5 rounded text-xs border">${item.category || '未分類'}</span></td>
          <td class="p-3 font-medium text-gray-800">${item.itemName}</td>
          <td class="p-3 font-semibold text-blue-600">${item.quantity}</td>
          <td class="p-3 text-gray-500 text-xs">${item.updatedAt || '-'}</td>
          <td class="p-3 text-center">
            <button onclick="deleteItem('${item.id}')" class="bg-red-500 text-white px-2 py-1 rounded text-xs hover:bg-red-600">刪除</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function deleteItem(id) {
      if (!confirm('確定要刪除這筆叫貨紀錄嗎？')) return;

      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'delete', id })
      });

      fetchData();
    }

    // 新增「門市專屬分類」
    async function addOnlyCategory() {
      const currentStore = document.getElementById('current-store').value;
      const category = document.getElementById('new-single-cat').value.trim();
      if (!category) return alert('請輸入分類名稱！');

      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'addCategory', store: currentStore, category })
      });

      document.getElementById('new-single-cat').value = '';
      await fetchCatalog();
      alert(`已成功為【${currentStore}】建立分類：「${category}」！`);
    }

    // 新增「門市專屬商品」
    async function addCatalogItem() {
      const currentStore = document.getElementById('current-store').value;
      const category = document.getElementById('catalog-cat-select').value;
      const itemName = document.getElementById('new-item-name').value.trim();
      if (!category || !itemName) return alert('請選擇分類並輸入品項名稱！');

      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'addCatalog', store: currentStore, category, itemName })
      });

      document.getElementById('new-item-name').value = '';
      await fetchCatalog();
      alert(`已成功將商品「${itemName}」加入【${currentStore}】的「${category}」分類！`);
    }

    // 初次載入
    onStoreChange();
    loadAllData();
  </script>
</body>
</html>
