<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>即時盤點管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-6 min-h-screen">
  <div class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-md">
    <h1 class="text-2xl font-bold mb-6 text-gray-800">雲端盤點管理系統</h1>

    <div class="bg-gray-50 p-4 rounded-lg mb-6 border border-gray-200">
      <h2 id="form-title" class="text-lg font-semibold mb-3 text-gray-700">新增盤點項目</h2>
      <input type="hidden" id="item-id">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <input type="text" id="item-name" placeholder="品項名稱" class="border p-2 rounded w-full">
        <input type="number" id="item-qty" placeholder="數量" class="border p-2 rounded w-full">
        <div class="flex gap-2">
          <button onclick="saveItem()" id="btn-save" class="bg-blue-600 text-white px-4 py-2 rounded w-full hover:bg-blue-700">新增</button>
          <button onclick="resetForm()" id="btn-cancel" class="bg-gray-400 text-white px-4 py-2 rounded hidden hover:bg-gray-500">取消</button>
        </div>
      </div>
    </div>

    <div class="flex justify-between items-center mb-4">
      <h2 class="text-lg font-semibold text-gray-700">目前盤點清單</h2>
      <button onclick="fetchData()" class="text-sm bg-gray-200 px-3 py-1 rounded hover:bg-gray-300">🔄 重新整理</button>
    </div>

    <div class="overflow-x-auto">
      <table class="min-w-full border-collapse border border-gray-200">
        <thead>
          <tr class="bg-gray-100 text-left text-sm font-semibold text-gray-600 border-b">
            <th class="p-3">品項名稱</th>
            <th class="p-3">數量</th>
            <th class="p-3">最後更新時間</th>
            <th class="p-3 text-center">操作</th>
          </tr>
        </thead>
        <tbody id="table-body" class="divide-y divide-gray-200 text-sm text-gray-700">
          <tr><td colspan="4" class="p-4 text-center text-gray-400">資料載入中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // ⚠️ 請替換成你發布 GAS 取得的 Web App 網址
    const API_URL = 'https://script.google.com/macros/s/AKfycbz-MoC5G8gSwk_3qjehTfwCtOrsYiCAAZrwHK571xkz8S6KoiD604wScV4Gkt0QbCHM/exec';

    // 讀取資料
    async function fetchData() {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-400">讀取最新資料中...</td></tr>';
      
      try {
        const res = await fetch(API_URL);
        const result = await res.json();
        renderTable(result.data);
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-red-500">載入失敗，請確認 API 網址設定。</td></tr>';
      }
    }

    // 渲染表格
    function renderTable(data) {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';

      if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-400">目前尚無資料</td></tr>';
        return;
      }

      data.forEach(item => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-gray-50';
        tr.innerHTML = `
          <td class="p-3 font-medium">${item.itemName}</td>
          <td class="p-3">${item.quantity}</td>
          <td class="p-3 text-gray-500 text-xs">${item.updatedAt || '-'}</td>
          <td class="p-3 text-center space-x-2">
            <button onclick="editItem('${item.id}', '${item.itemName}', ${item.quantity})" class="bg-amber-500 text-white px-2 py-1 rounded text-xs hover:bg-amber-600">修改</button>
            <button onclick="deleteItem('${item.id}')" class="bg-red-500 text-white px-2 py-1 rounded text-xs hover:bg-red-600">刪除</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 新增或修改儲存
    async function saveItem() {
      const id = document.getElementById('item-id').value;
      const itemName = document.getElementById('item-name').value.trim();
      const quantity = document.getElementById('item-qty').value;

      if (!itemName || quantity === '') {
        alert('請填寫完整名稱與數量！');
        return;
      }

      const action = id ? 'update' : 'create';
      const payload = { action, id, itemName, quantity };

      // 使用 text/plain 避免跨網域 OPTIONS 預檢請求
      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });

      resetForm();
      fetchData();
    }

    // 準備修改
    function editItem(id, name, qty) {
      document.getElementById('item-id').value = id;
      document.getElementById('item-name').value = name;
      document.getElementById('item-qty').value = qty;
      document.getElementById('form-title').innerText = '修改盤點項目';
      document.getElementById('btn-save').innerText = '儲存變更';
      document.getElementById('btn-cancel').classList.remove('hidden');
    }

    // 刪除資料
    async function deleteItem(id) {
      if (!confirm('確定要刪除這筆資料嗎？')) return;

      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'delete', id })
      });

      fetchData();
    }

    // 重置表單
    function resetForm() {
      document.getElementById('item-id').value = '';
      document.getElementById('item-name').value = '';
      document.getElementById('item-qty').value = '';
      document.getElementById('form-title').innerText = '新增盤點項目';
      document.getElementById('btn-save').innerText = '新增';
      document.getElementById('btn-cancel').classList.add('hidden');
    }

    // 頁面初次載入
    fetchData();
  </script>
</body>
</html>
