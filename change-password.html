<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="same-origin">
<title>修改主管密碼｜帳條審核與月報</title>
<style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#173d32;background:#f3f6f2}
*{box-sizing:border-box}body{margin:0;padding:28px 18px}main{max-width:480px;margin:5vh auto}nav{display:flex;justify-content:space-between;gap:16px;margin-bottom:24px;font-size:14px}a{color:#20664e;text-underline-offset:4px}.card{background:#fff;border:1px solid #dae5dc;border-radius:22px;padding:30px;box-shadow:0 12px 40px #173d3208}.eyebrow{font-size:12px;letter-spacing:2px;color:#65776b}h1{font-size:27px;margin:10px 0 12px}p{line-height:1.7;color:#65776b;font-size:14px}label{display:block;font-size:15px;font-weight:650;margin:22px 0 8px}input[type=password],input[type=text]{display:block;width:100%;font:inherit;font-size:16px;padding:13px 14px;margin-top:9px;border:1px solid #c9d7ce;border-radius:10px;background:#fcfdfb;color:#173d32}input:focus{outline:3px solid #c5e5d6;border-color:#20664e}.show{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:400;margin-top:16px}.show input{width:18px;height:18px}button,.primary-link{display:block;width:100%;padding:14px;border:0;border-radius:11px;background:#20664e;color:#fff;font:inherit;font-weight:700;text-align:center;text-decoration:none;margin-top:24px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}[hidden]{display:none!important}#message{margin-bottom:0;white-space:pre-line}#message.error{color:#a12432}#success h2{font-size:23px}#success{padding-top:10px}.note{border-top:1px solid #e4ebe5;padding-top:16px;margin-top:22px;font-size:13px}a:focus-visible,button:focus-visible{outline:3px solid #8ccfb0;outline-offset:3px}@media(max-width:400px){.card{padding:23px}main{margin-top:20px}}
</style>
</head>
<body>
<main>
<nav aria-label="返回頁面"><a href="admin.html" target="_top">← 叫貨管理</a><a href="receipts-admin.html" target="_top">帳條審核與月報</a></nav>
<section class="card">
<div class="eyebrow">帳條管理 · 主管設定</div>
<h1>修改主管密碼</h1>
<div id="editor">
<p>輸入目前密碼，再設定新密碼。<br>新密碼至少 4 個字元。</p>
<form id="password-form">
<label for="current-password">目前密碼<input id="current-password" name="current-password" type="password" autocomplete="current-password" minlength="4" maxlength="128" required></label>
<label for="new-password">新密碼<input id="new-password" name="new-password" type="password" autocomplete="new-password" minlength="4" maxlength="128" required aria-describedby="password-hint"></label>
<p id="password-hint">可使用數字或文字，長度為 4～128 個字元。</p>
<label for="confirm-password">再次輸入新密碼<input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="4" maxlength="128" required></label>
<label class="show"><input id="show-password" type="checkbox">顯示密碼</label>
<button id="save-password" type="submit">儲存新密碼</button>
</form>
<p class="note">修改後，所有主管都需使用新密碼重新登入帳條管理。門市叫貨管理仍可直接使用。</p>
</div>
<div id="success" hidden>
<h2>密碼已更新</h2>
<p>請使用新密碼重新登入「帳條審核與月報」。</p>
<a class="primary-link" href="receipts-admin.html" target="_top">使用新密碼登入</a>
</div>
<p id="message" role="status" aria-live="polite"></p>
</section>
</main>
<script>
(()=>{
'use strict';
const API='https://rjetwgrelmvciatouwiw.supabase.co/functions/v1/receipt-api';
const $=id=>document.getElementById(id);
const fields=['current-password','new-password','confirm-password'];
let busy=false;
$('show-password').addEventListener('change',()=>{fields.forEach(id=>{$(id).type=$('show-password').checked?'text':'password';});});
async function request(action,body,token){
 let response;
 try{response=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify({action,...body})});}
 catch{throw Error(action==='change_password'?'連線中斷，無法確認是否已更新。請先使用新密碼登入確認，再決定是否重試。':'無法連線，請檢查網路後再試。');}
 let data;
 try{data=await response.json();}catch{throw Error('伺服器回應異常，請稍後再試；若剛剛送出修改，請先用新密碼登入確認。');}
 if(!response.ok)throw Error(data.error||'操作失敗，請稍後再試。');
 return data;
}
$('password-form').addEventListener('submit',async event=>{
 event.preventDefault();if(busy)return;
 const current=$('current-password').value,next=$('new-password').value,confirm=$('confirm-password').value;
 const message=$('message');
 message.className='error';message.textContent='';
 if(!current||current.length>128||next.length<4||next.length>128){message.textContent='請填寫目前密碼，新密碼需為 4～128 個字元。';return;}
 if(next!==confirm){message.textContent='兩次新密碼不一致，請重新輸入。';$('confirm-password').focus();return;}
 if(next===current){message.textContent='新密碼不能與目前密碼相同。';$('new-password').focus();return;}
 busy=true;$('save-password').disabled=true;fields.forEach(id=>{$(id).disabled=true;});
 message.className='';message.textContent='正在驗證目前密碼並更新…';
 try{
  const login=await request('admin_login',{password:current});
  if(!login.token)throw Error('驗證未完成，請稍後再試。');
  const result=await request('change_password',{current_password:current,new_password:next},login.token);
  if(result.ok!==true)throw Error('未收到更新確認，請先用新密碼登入確認。');
  try{sessionStorage.removeItem('receipt-admin-session');}catch{}
  $('password-form').reset();fields.forEach(id=>{$(id).type='password';});
  $('editor').hidden=true;$('success').hidden=false;message.textContent='主管密碼已更新，舊登入狀態已失效。';
 }catch(error){message.className='error';message.textContent=error.message;}
 finally{busy=false;$('save-password').disabled=false;fields.forEach(id=>{$(id).disabled=false;});}
});
})();
</script>
</body>
</html>
