<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>帳條審核｜主管</title><link rel="stylesheet" href="receipts.css"></head><body><main style="max-width:1100px"><nav><a href="admin.html">← 叫貨管理</a><a href="receipts.html">員工帳條上傳</a></nav><header><small>主管專區</small><h1>帳條審核與月報</h1></header><section id="login"><p>請輸入主管專用密碼。分店密碼不能進入此頁。</p><form id="login-form"><label>密碼<input id="password" minlength="4" maxlength="128" type="password" autocomplete="current-password" required></label><button>主管登入</button></form></section><section id="workspace" hidden><details id="password-settings" style="margin:12px 0;padding:12px;border:1px solid #dce5df;border-radius:10px"><summary style="cursor:pointer;font-weight:700">修改主管密碼</summary><form id="change-password-form"><label>目前密碼<input id="current-password" type="password" autocomplete="current-password" maxlength="128" required></label><label>新密碼（至少 4 個字元）<input id="new-password" type="password" autocomplete="new-password" minlength="4" maxlength="128" required></label><label>再次輸入新密碼<input id="confirm-password" type="password" autocomplete="new-password" minlength="4" maxlength="128" required></label><p class="muted">修改後，所有使用這組主管密碼的登入都需重新登入。</p><button>儲存新密碼</button><p id="password-message" role="status"></p></form></details><div class="row"><label>月份<input id="month" type="month"></label><label>分店<select id="store"><option value="">全部分店</option></select></label><button id="logout" class="secondary">登出</button></div><button id="load">查詢</button><p id="summary"></p><button id="export" class="secondary">匯出 CSV（Excel 可開啟）</button><div class="scroll"><table><thead><tr><th>日期</th><th>分店</th><th>班別</th><th>總營收</th><th>熊貓營收</th><th>Uber 營收</th><th>現金營收</th><th>支出</th><th>帳條</th><th>已確認</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section><p id="message" role="status"></p><dialog id="photo-dialog"><button id="close-photo">關閉照片</button><img id="full-photo" alt="帳條照片" style="max-width:85vw;max-height:75vh"></dialog><dialog id="edit-dialog"><form id="edit-report-form"><h2>修改帳條</h2><p id="edit-title"></p><label>總營收<input name="revenue" type="number" min="0" max="9999999999.99" step="0.01" required></label><label>熊貓營收<input name="foodpanda_revenue" type="number" min="0" max="9999999999.99" step="0.01" required></label><label>Uber 營收<input name="uber_revenue" type="number" min="0" max="9999999999.99" step="0.01" required></label><label>現金營收<input name="cash_revenue" type="number" min="0" max="9999999999.99" step="0.01" required></label><label>支出總額<input name="expense" type="number" min="0" max="9999999999.99" step="0.01" required></label><label>更換帳條照片（不選則保留原照）<input name="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><p>修改後將取消已確認，請重新核對。照片限 8MB 內 JPG、PNG、WebP。</p><button type="submit">儲存修改</button><button type="button" id="cancel-edit" class="secondary">取消</button><p id="edit-error" role="status"></p></form></dialog></main><script src="receipts-admin.js?v=uber-stores-20261022"></script></body></html>
