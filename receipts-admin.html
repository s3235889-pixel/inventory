<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>帳條審核｜主管</title><link rel="stylesheet" href="receipts.css"></head><body><main style="max-width:1100px"><nav><a href="admin.html">← 叫貨管理</a><a href="receipts.html">員工帳條上傳</a></nav><header><small>主管專區</small><h1>帳條審核與月報</h1></header><section id="login"><p>請輸入主管專用密碼。分店密碼不能進入此頁。</p><form id="login-form"><label>密碼<input id="password" minlength="10" maxlength="128" type="password" autocomplete="current-password" required></label><button>主管登入</button></form></section><section id="workspace" hidden><div class="row"><label>月份<input id="month" type="month"></label><label>分店<select id="store"><option value="">全部分店</option></select></label><button id="logout" class="secondary">登出</button></div><button id="load">查詢</button><p id="summary"></p><button id="export" class="secondary">匯出 CSV（Excel 可開啟）</button><div class="scroll"><table><thead><tr><th>日期</th><th>分店</th><th>班別</th><th>營收</th><th>支出</th><th>帳條</th><th>已確認</th></tr></thead><tbody id="rows"></tbody></table></div></section><p id="message" role="status"></p><dialog id="photo-dialog"><button id="close-photo">關閉照片</button><img id="full-photo" alt="帳條照片" style="max-width:85vw;max-height:75vh"></dialog></main><script src="receipts-admin.js"></script></body></html>
