<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>門市叫貨總表 (含缺貨下拉核對)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 Supabase 官方 SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style id="dynamic-font-style">
    :root {
      --custom-font-size: 11.5px;
    }
  </style>
  <style>
    html, body {
      min-height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
    }

    @media print {
      @page {
        size: A4 landscape;
        margin: 3mm 4mm 3mm 4mm;
      }
      html, body {
        height: auto !important;
        overflow: hidden !important;
        background-color: white !important;
        padding: 0 !important;
        margin: 0 !important;
        color: #0f172a !important;
        page-break-after: avoid !important;
        break-after: avoid !important;
      }
      .no-print {
        display: none !important;
      }
      .print-area {
        width: 100% !important;
        max-width: none !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .print-grid {
        display: grid !important;
        grid-template-columns: repeat(6, minmax(0, 1fr)) !important;
        gap: 3px !important;
        page-break-inside: avoid !important;
      }
      .print-card {
        break-inside: avoid !important;
        page-break-inside: avoid !important;
        border: 1px solid #475569 !important;
        box-shadow: none !important;
        border-radius: 3px !important;
      }
      .print-header {
        border-bottom: 2px solid #0f172a !important;
        padding-bottom: 2px !important;
        margin-bottom: 3px !important;
      }
      .shortage-select {
        display: none !important;
      }
      .print-shortage-label {
        display: inline-block !important;
        font-weight: bold;
        font-size: 9px;
      }
    }

    .print-shortage-label {
      display: none;
    }

    .dynamic-text-table th, 
    .dynamic-text-table td {
      font-size: var(--custom-font-size) !important;
      padding: calc(var(--custom-font-size) * 0.1 + 1px) calc(var(--custom-font-size) * 0.12 + 1px) !important;
      line-height: 1.15 !important;
    }
    
    .dynamic-store-title {
      font-size: calc(var(--custom-font-size) * 1.05) !important;
    }

    /* 勾選完成後的劃記反白效果 */
    .row-checked {
      background-color: #f1f5f9 !important;
      color: #94a3b8 !important;
      text-decoration: line-through;
    }
    .row-checked td {
      color: #94a3b8 !important;
    }

    /* 缺貨醒目樣式 */
    .row-shortage {
      background-color: #ffe4e6 !important; /* 淺粉紅 */
      border-left: 3px solid #e11d48 !important;
    }
    .row-shortage td {
      color: #9f1239 !important;
    }
  </style>
</head>
<body class="bg-slate-100 p-3 md:p-4 min-h-screen relative">
<nav style="padding:12px"><a href="receipts-admin.html" style="font-weight:bold;color:#20664e">📷 帳條審核與月報</a></nav>

  <div class="max-w-[1450px] mx-auto space-y-3 print-area pb-12">
    
    <!-- 頂部標題區塊 -->
    <div class="bg-slate-900 text-white p-4 rounded-2xl shadow-lg flex flex-wrap justify-between items-center gap-4 no-print">
      <div>
        <h1 class="text-xl font-bold flex items-center gap-2">
          🚚 門市叫貨出貨總表 (正常出貨/缺貨核對)
        </h1>
        <p class="text-xs text-slate-300 mt-1">門市順序：萬丹 ➔ 潮州 ➔ 屏東 ➔ 仁愛 ➔ 木崎 ➔ 東港 (綠字正常出貨 / 紅字缺貨標記)</p>
      </div>
      <button onclick="window.print()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold px-4 py-2 rounded-xl transition flex items-center gap-1.5 shadow-md">
        🖨️ 列印 6 欄 A4 總表
      </button>
    </div>

    <!-- 控制面板 -->
    <div class="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200 space-y-3 no-print">
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-3 items-center">
        
        <!-- 1. 日期篩選 -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">📅 選擇叫貨日期</label>
          <input type="date" id="filter-date" onchange="fetchDataFromSupabase()" class="border p-2 rounded-lg w-full text-xs font-bold text-slate-800 bg-slate-50 focus:bg-white focus:outline-none">
        </div>

        <!-- 2. 時段篩選 -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">⏰ 叫貨時段</label>
          <select id="filter-shift" onchange="fetchDataFromSupabase()" class="border p-2 rounded-lg w-full text-xs font-bold text-slate-800 bg-slate-50 focus:bg-white focus:outline-none">
            <option value="">全部時段 (下午 + 打烊)</option>
            <option value="下午">☀️ 下午時段</option>
            <option value="打烊">🌙 打烊時段</option>
          </select>
        </div>

        <!-- 3. 門市過濾 -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">🏪 門市快速過濾</label>
          <select id="filter-store" onchange="renderData()" class="border p-2 rounded-lg w-full text-xs font-bold text-slate-800 bg-slate-50 focus:bg-white focus:outline-none">
            <option value="">顯示全部 6 店</option>
            <option value="萬丹店(W)">萬丹店(W)</option>
            <option value="潮州店(C1)">潮州店(C1)</option>
            <option value="屏東店(P1)">屏東店(P1)</option>
            <option value="仁愛店(P2)">仁愛店(P2)</option>
            <option value="木崎(C2)">木崎(C2)</option>
            <option value="東港店(D)">東港店(D)</option>
          </select>
        </div>

        <!-- 4. 文字大小調整拉桿 -->
        <div class="bg-indigo-50/60 p-2 rounded-lg border border-indigo-100">
          <div class="flex justify-between items-center mb-1">
            <label class="text-xs font-bold text-indigo-900">🔤 文字大小</label>
            <span id="font-size-val" class="text-xs font-black text-indigo-600">11.5px</span>
          </div>
          <input type="range" id="font-size-range" min="8" max="24" value="11.5" step="0.5" oninput="adjustFontSize(this.value)" class="w-full accent-indigo-600 cursor-pointer">
        </div>

        <!-- 5. 重新整理 -->
        <div class="flex items-end">
          <button onclick="fetchDataFromSupabase()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold p-2 rounded-lg border transition text-xs flex justify-center items-center gap-1">
            🔄 重新整理資料
          </button>
        </div>

      </div>
    </div>

    <!-- 列印抬頭 -->
    <div class="print-header flex justify-between items-end pb-1 border-b-2 border-slate-800">
      <div>
        <h2 class="text-base font-black text-slate-900">📊 各門市叫貨出貨核對總表 (6門市一頁式)</h2>
        <p class="text-[10px] text-slate-500">列印時間：<span id="print-timestamp"></span></p>
      </div>
      <div class="text-right text-[11px] text-slate-700">
        <span><strong>查詢日期：</strong><span id="summary-date">-</span></span> │ 
        <span><strong>時段條件：</strong><span id="summary-shift">全部時段</span></span>
      </div>
    </div>

    <!-- 數據容器 -->
    <div id="data-container" class="print-grid grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-2">
      <div class="col-span-full bg-white p-8 rounded-xl text-center text-slate-400 border">
        資料載入中...
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://rjetwgrelmvciatouwiw.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_Zvf4B53wK4tXQAIWOGiaYQ_KSxVO5MZ';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 🌟 指定門市顯示順序
    const TARGET_STORES = [
      '萬丹店(W)',
      '潮州店(C1)', 
      '屏東店(P1)', 
      '仁愛店(P2)', 
      '木崎(C2)', 
      '東港店(D)'
    ];

    let currentFetchedData = [];

    document.addEventListener('DOMContentLoaded', () => {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('filter-date').value = today;
      fetchDataFromSupabase();
    });

    function adjustFontSize(val) {
      document.getElementById('font-size-val').innerText = `${val}px`;
      document.documentElement.style.setProperty('--custom-font-size', `${val}px`);
    }

    function updateTimestamp() {
      const now = new Date();
      document.getElementById('print-timestamp').innerText = now.toLocaleString('zh-TW', { hour12: false });
    }

    // 點擊核對勾選框，同步紀錄反白狀態至 Supabase
    async function toggleRowCheck(checkbox, orderItemId) {
      const row = checkbox.closest('tr');
      const isChecked = checkbox.checked;

      if (isChecked) {
        row.classList.add('row-checked');
      } else {
        row.classList.remove('row-checked');
      }

      if (orderItemId) {
        await supabaseClient
          .from('order_items')
          .update({ is_checked: isChecked })
          .eq('order_item_id', orderItemId);
      }
    }

    // 🌟 處理「正常出貨 / 缺 1 ~ 缺 10」變更
    async function handleShortageQtyChange(selectEl, orderItemId, orderedQty) {
      const row = selectEl.closest('tr');
      const printLabel = row.querySelector('.print-shortage-label');
      const shortQty = parseInt(selectEl.value, 10) || 0;

      let actualQty = Math.max(0, orderedQty - shortQty);
      let note = '';

      if (shortQty === 0) {
        // 正常出貨（綠字）
        actualQty = orderedQty;
        note = '正常出貨';
        selectEl.className = 'shortage-select bg-white border border-emerald-300 rounded text-[10px] p-0.5 font-bold text-emerald-600 focus:outline-none cursor-pointer';
        row.classList.remove('row-shortage');
        if (printLabel) printLabel.innerText = '';
      } else {
        // 缺貨（紅字）
        note = `缺${shortQty}(實出${actualQty})`;
        selectEl.className = 'shortage-select bg-rose-50 border border-rose-400 rounded text-[10px] p-0.5 font-black text-rose-600 focus:outline-none cursor-pointer';
        row.classList.add('row-shortage');
        if (printLabel) printLabel.innerText = `[缺${shortQty}]`;
      }

      // 即時同步回 Supabase 資料庫
      if (orderItemId) {
        await supabaseClient
          .from('order_items')
          .update({
            actual_quantity: actualQty,
            note: note
          })
          .eq('order_item_id', orderItemId);
      }
    }

    // 🚀 從 Supabase 跨表查詢資料
    async function fetchDataFromSupabase() {
      const container = document.getElementById('data-container');
      const selectedDate = document.getElementById('filter-date').value;
      const selectedShift = document.getElementById('filter-shift').value;

      container.innerHTML = '<div class="col-span-full bg-white p-8 rounded-xl text-center text-slate-400 border">正在透過 Supabase 加載數據...</div>';

      try {
        let query = supabaseClient
          .from('order_items')
          .select(`
            order_item_id,
            quantity,
            actual_quantity,
            note,
            is_checked,
            orders!inner (
              order_date,
              shift,
              stores!inner ( store_name, sort_order )
            ),
            items!inner (
              item_name,
              categories!inner ( category_name, priority )
            )
          `)
          .eq('orders.order_date', selectedDate);

        if (selectedShift) {
          query = query.eq('orders.shift', selectedShift);
        }

        const { data, error } = await query;

        if (error) throw error;

        currentFetchedData = data || [];
        renderData();
      } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="col-span-full bg-white p-8 rounded-xl text-center text-red-500 border">Supabase 讀取失敗: ${err.message}</div>`;
      }
    }

    // 🌟 產生「正常出貨 (綠) / 缺 1 ~ 缺 10 (紅)」下拉選單 HTML
    function buildShortageQtySelectHTML(orderItemId, orderedQty, actualQty, note) {
      let currentShortage = 0;
      if (actualQty !== null && actualQty !== undefined && actualQty < orderedQty) {
        currentShortage = Math.max(0, orderedQty - actualQty);
      } else if (note && note.includes('缺')) {
        const match = note.match(/缺(\d+)/);
        if (match) currentShortage = parseInt(match[1], 10);
      }

      const isShort = currentShortage > 0;
      const selectClass = isShort
        ? 'shortage-select bg-rose-50 border border-rose-400 rounded text-[10px] p-0.5 font-black text-rose-600 focus:outline-none cursor-pointer'
        : 'shortage-select bg-white border border-emerald-300 rounded text-[10px] p-0.5 font-bold text-emerald-600 focus:outline-none cursor-pointer';

      let optionsHTML = '';

      // 1. 預設「正常出貨」(綠色字)
      optionsHTML += `<option value="0" class="text-emerald-600 font-bold" ${currentShortage === 0 ? 'selected' : ''}>正常出貨</option>`;

      // 2. 缺貨選項：提供 1 到 10（若叫貨量大於 10 則擴充至該叫貨數量）
      const maxShortOption = Math.max(10, orderedQty);
      for (let s = 1; s <= maxShortOption; s++) {
        const isSelected = (s === currentShortage);
        optionsHTML += `<option value="${s}" class="text-rose-600 font-bold" ${isSelected ? 'selected' : ''}>缺 ${s}</option>`;
      }

      const printText = isShort ? `[缺${currentShortage}]` : '';

      return `
        <select onchange="handleShortageQtyChange(this, ${orderItemId}, ${orderedQty})" class="${selectClass}">
          ${optionsHTML}
        </select>
        <span class="print-shortage-label text-rose-700 font-bold">${printText}</span>
      `;
    }

    // 🎨 畫面渲染 Engine
    function renderData() {
      updateTimestamp();
      const selectedDate = document.getElementById('filter-date').value;
      const selectedShift = document.getElementById('filter-shift').value;
      const selectedStore = document.getElementById('filter-store').value;
      const container = document.getElementById('data-container');

      document.getElementById('summary-date').innerText = selectedDate || '全部日期';
      document.getElementById('summary-shift').innerText = selectedShift ? `${selectedShift}時段` : '全部時段';

      const storeDataMap = {};
      TARGET_STORES.forEach(store => storeDataMap[store] = []);

      currentFetchedData.forEach(row => {
        const storeName = row.orders.stores.store_name;
        const matchedStore = TARGET_STORES.find(s => s.includes(storeName) || storeName.includes(s));

        if (matchedStore) {
          storeDataMap[matchedStore].push({
            orderItemId: row.order_item_id,
            itemName: row.items.item_name,
            categoryName: row.items.categories.category_name,
            priority: row.items.categories.priority,
            quantity: row.quantity,
            actualQuantity: row.actual_quantity,
            note: row.note,
            isChecked: row.is_checked
          });
        }
      });

      container.innerHTML = '';

      let displayStores = TARGET_STORES;
      if (selectedStore) {
        displayStores = TARGET_STORES.filter(s => s === selectedStore);
      }

      displayStores.forEach(storeName => {
        let itemsList = storeDataMap[storeName] || [];

        // 依據類別優先權排序 (冷藏 -> 鯛魚燒 -> 乾貨)
        itemsList.sort((a, b) => a.priority - b.priority);

        const storeCard = document.createElement('div');
        storeCard.className = 'print-card bg-white rounded border border-slate-300 overflow-hidden shadow-sm flex flex-col justify-between';

        let rowsHtml = '';
        if (itemsList.length === 0) {
          rowsHtml = `<tr><td colspan="5" class="text-center text-slate-400 py-3">無叫貨紀錄</td></tr>`;
        } else {
          rowsHtml = itemsList.map((item, idx) => {
            const pLevel = item.priority;
            
            let rowClass = '';
            if (pLevel === 1) {
              rowClass = 'bg-amber-100/70 font-black text-amber-950';
            } else if (pLevel === 2) {
              rowClass = 'bg-orange-100/70 font-bold text-orange-950';
            } else if (pLevel === 3) {
              rowClass = 'bg-sky-100/60 font-bold text-sky-950';
            }

            // 判斷是否缺貨
            const isShortage = (item.actualQuantity !== null && item.actualQuantity < item.quantity) || (item.note && item.note.includes('缺'));
            if (isShortage) {
              rowClass += ' row-shortage';
            }

            const checkedClass = item.isChecked ? 'row-checked' : '';
            const shortageSelectHtml = buildShortageQtySelectHTML(item.orderItemId, item.quantity, item.actualQuantity, item.note);

            return `
              <tr class="border-b last:border-0 border-slate-200 transition-colors ${rowClass} ${checkedClass}">
                <td class="text-center text-slate-400 w-3.5">${idx + 1}</td>
                <td class="font-bold text-slate-800 break-all leading-tight">${item.itemName}</td>
                <td class="text-center font-black text-indigo-700 w-6">${item.quantity}</td>
                <td class="text-center w-24">
                  ${shortageSelectHtml}
                </td>
                <td class="text-center w-4 no-print">
                  <input type="checkbox" ${item.isChecked ? 'checked' : ''} onchange="toggleRowCheck(this, ${item.orderItemId})" class="w-3.5 h-3.5 accent-indigo-600 rounded cursor-pointer align-middle">
                </td>
              </tr>
            `;
          }).join('');
        }

        storeCard.innerHTML = `
          <div>
            <div class="bg-slate-800 text-white px-1.5 py-0.5 flex justify-between items-center print:bg-slate-900">
              <span class="font-bold dynamic-store-title truncate">🏪 ${storeName}</span>
              <span class="text-[9px] bg-slate-700 px-1 rounded text-slate-200">${itemsList.length}項</span>
            </div>
            <table class="dynamic-text-table w-full text-left">
              <thead>
                <tr class="bg-slate-100 text-slate-600 border-b border-slate-300 font-bold text-[10px]">
                  <th class="text-center w-3.5">#</th>
                  <th>品項</th>
                  <th class="text-center w-6">叫</th>
                  <th class="text-center w-24">出貨/缺貨</th>
                  <th class="text-center w-4 no-print">核</th>
                </tr>
              </thead>
              <tbody>
                ${rowsHtml}
              </tbody>
            </table>
          </div>
        `;

        container.appendChild(storeCard);
      });
    }
  </script>
</body>
</html>
