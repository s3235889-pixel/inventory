<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>門市叫貨總表 (前端快取極速版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style id="dynamic-font-style">
    :root {
      --custom-font-size: 12px;
    }
  </style>
  <style>
    html, body {
      min-height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
    }

    #drawing-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 40;
      pointer-events: none;
    }
    #drawing-canvas.active {
      pointer-events: auto;
      cursor: crosshair;
    }

    @media print {
      @page {
        size: A4 landscape;
        margin: 3mm 4mm 3mm 4mm;
      }
      html, body {
        height: auto !important;
        overflow: hidden !important;
        background-color: white !important;
        padding: 0 !important;
        margin: 0 !important;
        color: #0f172a !important;
        page-break-after: avoid !important;
        break-after: avoid !important;
      }
      .no-print {
        display: none !important;
      }
      .print-area {
        width: 100% !important;
        max-width: none !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .print-grid {
        display: grid !important;
        grid-template-columns: repeat(6, minmax(0, 1fr)) !important;
        gap: 3px !important;
        page-break-inside: avoid !important;
      }
      .print-card {
        break-inside: avoid !important;
        page-break-inside: avoid !important;
        border: 1px solid #475569 !important;
        box-shadow: none !important;
        border-radius: 3px !important;
      }
      .print-header {
        border-bottom: 2px solid #0f172a !important;
        padding-bottom: 2px !important;
        margin-bottom: 3px !important;
      }
    }

    .dynamic-text-table th, 
    .dynamic-text-table td {
      font-size: var(--custom-font-size) !important;
      padding: calc(var(--custom-font-size) * 0.12 + 1px) calc(var(--custom-font-size) * 0.15 + 1px) !important;
      line-height: 1.1 !important;
    }
    
    .dynamic-store-title {
      font-size: calc(var(--custom-font-size) * 1.05) !important;
    }
  </style>
</head>
<body class="bg-slate-100 p-4 min-h-screen relative">

  <!-- 全螢幕手繪畫布 -->
  <canvas id="drawing-canvas"></canvas>

  <!-- 浮動手繪工具面板 -->
  <div id="draw-toolbar" class="fixed bottom-4 right-4 z-50 bg-slate-900/95 text-white p-3 rounded-2xl shadow-2xl no-print border border-slate-700 flex flex-wrap items-center gap-3 backdrop-blur-md transition-all">
    <button id="toggle-draw-btn" onclick="toggleDrawingMode()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow">
      🎨 開啟手繪標註
    </button>

    <div id="draw-controls" class="hidden flex items-center gap-3 border-l border-slate-700 pl-3">
      <div class="flex items-center gap-1 bg-slate-800 p-1 rounded-lg">
        <button onclick="setBrushType('pencil')" id="btn-pencil" class="px-2 py-1 text-xs font-bold rounded bg-indigo-600 text-white">✏️ 鉛筆</button>
        <button onclick="setBrushType('highlighter')" id="btn-highlighter" class="px-2 py-1 text-xs font-bold rounded hover:bg-slate-700 text-slate-300">🖊️ 螢光筆</button>
        <button onclick="setBrushType('eraser')" id="btn-eraser" class="px-2 py-1 text-xs font-bold rounded hover:bg-slate-700 text-slate-300">🧹 橡皮擦</button>
      </div>

      <div class="flex items-center gap-1.5">
        <span class="text-[10px] text-slate-400 font-bold">粗細</span>
        <input type="range" id="brush-size" min="1" max="30" value="3" oninput="updateBrushSize(this.value)" class="w-20 accent-indigo-500 cursor-pointer">
        <span id="brush-size-val" class="text-xs font-mono w-5">3</span>
      </div>

      <div class="flex items-center gap-1">
        <input type="color" id="brush-color" value="#ef4444" onchange="updateBrushColor(this.value)" class="w-7 h-7 rounded border-0 cursor-pointer bg-transparent">
        <button onclick="setQuickColor('#ef4444')" class="w-5 h-5 rounded-full bg-red-500 border border-white/20"></button>
        <button onclick="setQuickColor('#3b82f6')" class="w-5 h-5 rounded-full bg-blue-500 border border-white/20"></button>
        <button onclick="setQuickColor('#facc15')" class="w-5 h-5 rounded-full bg-yellow-400 border border-white/20"></button>
        <button onclick="setQuickColor('#10b981')" class="w-5 h-5 rounded-full bg-emerald-500 border border-white/20"></button>
      </div>

      <button onclick="clearCanvas()" class="bg-rose-600/80 hover:bg-rose-600 text-white text-xs px-2.5 py-1.5 rounded-lg font-bold transition">
        🗑️ 清空
      </button>
    </div>
  </div>

  <div class="max-w-[1400px] mx-auto space-y-3 print-area pb-12">
    
    <div class="bg-slate-900 text-white p-4 rounded-2xl shadow-lg flex flex-wrap justify-between items-center gap-4 no-print">
      <div>
        <h1 class="text-xl font-bold flex items-center gap-2">
          📊 門市叫貨總表 (前端快取極速版)
        </h1>
        <p class="text-xs text-slate-300 mt-1">無需修改後端，切換日期/門市毫秒級秒開</p>
      </div>
      <button onclick="window.print()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold px-4 py-2 rounded-xl transition flex items-center gap-1.5 shadow-md">
        🖨️ 列印 6 欄 A4 總表
      </button>
    </div>

    <!-- 下拉篩選控制面板 -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3 no-print">
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-3 items-center">
        
        <!-- 1. 日期篩選 (直接調用 renderData 秒刷，不重新發請求) -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">📅 選擇日期</label>
          <input type="date" id="filter-date" onchange="renderData()" class="border p-2 rounded-lg w-full text-sm font-bold text-slate-800 bg-slate-50 focus:bg-white focus:outline-none">
        </div>

        <!-- 2. 時段篩選 -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">⏰ 叫貨時段</label>
          <select id="filter-shift" onchange="renderData()" class="border p-2 rounded-lg w-full text-sm font-bold text-slate-800 bg-slate-50 focus:bg-white focus:outline-none">
            <option value="">全部時段 (下午 + 打烊)</option>
            <option value="下午">☀️ 下午時段</option>
            <option value="打烊">🌙 打烊時段</option>
          </select>
        </div>

        <!-- 3. 門市過濾 -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">🏪 門市快速過濾</label>
          <select id="filter-store" onchange="renderData()" class="border p-2 rounded-lg w-full text-sm font-bold text-slate-800 bg-slate-50 focus:bg-white focus:outline-none">
            <option value="">顯示全部 6 店</option>
            <option value="萬丹店(W)">萬丹店(W)</option>
            <option value="潮州店(C1)">潮州店(C1)</option>
            <option value="屏東店(P1)">屏東店(P1)</option>
            <option value="仁愛店(P2)">仁愛店(P2)</option>
            <option value="木崎(C2)">木崎(C2)</option>
            <option value="東港店(D)">東港店(D)</option>
          </select>
        </div>

        <!-- 4. 文字大小調整拉桿 -->
        <div class="bg-indigo-50/60 p-2 rounded-lg border border-indigo-100">
          <div class="flex justify-between items-center mb-1">
            <label class="text-xs font-bold text-indigo-900">🔤 文字大小</label>
            <span id="font-size-val" class="text-xs font-black text-indigo-600">12px</span>
          </div>
          <input type="range" id="font-size-range" min="8" max="30" value="12" step="0.5" oninput="adjustFontSize(this.value)" class="w-full accent-indigo-600 cursor-pointer">
        </div>

        <!-- 5. 強制重新向雲端抓取 (清空快取) -->
        <div class="flex items-end">
          <button onclick="fetchCloudData(true)" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold p-2 rounded-lg border transition text-sm flex justify-center items-center gap-1">
            🔄 強制更新數據
          </button>
        </div>

      </div>
    </div>

    <!-- 列印抬頭 -->
    <div class="print-header flex justify-between items-end pb-1 border-b-2 border-slate-800">
      <div>
        <h2 class="text-base font-black text-slate-900">📊 各門市叫貨統計總表 (6門市一頁總表)</h2>
        <p class="text-[10px] text-slate-500">列印時間：<span id="print-timestamp"></span></p>
      </div>
      <div class="text-right text-[11px] text-slate-700">
        <span><strong>查詢日期：</strong><span id="summary-date">-</span></span> │ 
        <span><strong>時段條件：</strong><span id="summary-shift">全部時段</span></span>
      </div>
    </div>

    <!-- 數據容器 -->
    <div id="data-container" class="print-grid grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-2">
      <div class="col-span-full bg-white p-8 rounded-xl text-center text-slate-400 border">
        資料載入中...
      </div>
    </div>

  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxiblsuljzndWVVMCbHOMekJqIKlshKcprpO6SS7i8PMTHnLojT1B4LXjutB_IEb3dVoQ/exec';
    
    const TARGET_STORES = ['萬丹店(W)', '潮州店(C1)', '屏東店(P1)', '仁愛店(P2)', '木崎(C2)', '東港店(D)'];

    // 全局資料快取與預解析結構
    let rawDataCache = null;

    // ==========================================
    // 🎨 手繪畫布 Engine
    // ==========================================
    let canvas, ctx;
    let isDrawing = false;
    let isDrawingMode = false;
    let currentBrush = 'pencil'; 
    let currentColor = '#ef4444';
    let currentSize = 3;

    function initCanvas() {
      canvas = document.getElementById('drawing-canvas');
      ctx = canvas.getContext('2d');
      resizeCanvas();

      window.addEventListener('resize', resizeCanvas);
      canvas.addEventListener('mousedown', startDrawing);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', stopDrawing);
      canvas.addEventListener('mouseleave', stopDrawing);

      canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
      canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
      canvas.addEventListener('touchend', stopDrawing);
    }

    function resizeCanvas() {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = canvas.width;
      tempCanvas.height = canvas.height;
      const tempCtx = tempCanvas.getContext('2d');
      if (canvas.width > 0 && canvas.height > 0) {
        tempCtx.drawImage(canvas, 0, 0);
      }

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      if (tempCanvas.width > 0 && tempCanvas.height > 0) {
        ctx.drawImage(tempCanvas, 0, 0);
      }
    }

    function toggleDrawingMode() {
      isDrawingMode = !isDrawingMode;
      const btn = document.getElementById('toggle-draw-btn');
      const controls = document.getElementById('draw-controls');

      if (isDrawingMode) {
        canvas.classList.add('active');
        btn.innerHTML = '❌ 結束標註';
        btn.classList.replace('bg-indigo-600', 'bg-slate-700');
        controls.classList.remove('hidden');
      } else {
        canvas.classList.remove('active');
        btn.innerHTML = '🎨 開啟手繪標註';
        btn.classList.replace('bg-slate-700', 'bg-indigo-600');
        controls.classList.add('hidden');
      }
    }

    function setBrushType(type) {
      currentBrush = type;
      ['pencil', 'highlighter', 'eraser'].forEach(t => {
        const b = document.getElementById(`btn-${t}`);
        if (t === type) {
          b.className = 'px-2 py-1 text-xs font-bold rounded bg-indigo-600 text-white';
        } else {
          b.className = 'px-2 py-1 text-xs font-bold rounded hover:bg-slate-700 text-slate-300';
        }
      });
    }

    function updateBrushSize(val) {
      currentSize = val;
      document.getElementById('brush-size-val').innerText = val;
    }

    function updateBrushColor(val) {
      currentColor = val;
    }

    function setQuickColor(color) {
      currentColor = color;
      document.getElementById('brush-color').value = color;
      if (currentBrush === 'eraser') setBrushType('pencil');
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function getPos(e) {
      return { x: e.clientX, y: e.clientY };
    }

    function startDrawing(e) {
      if (!isDrawingMode) return;
      isDrawing = true;
      const pos = getPos(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }

    function draw(e) {
      if (!isDrawing || !isDrawingMode) return;
      const pos = getPos(e);

      ctx.lineWidth = currentSize;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      if (currentBrush === 'eraser') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.lineWidth = currentSize * 3;
      } else if (currentBrush === 'highlighter') {
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = currentColor + '66';
        ctx.lineWidth = currentSize * 2.5;
      } else {
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = currentColor;
      }

      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function stopDrawing() {
      if (isDrawing) {
        ctx.closePath();
        isDrawing = false;
      }
    }

    function handleTouchStart(e) {
      if (!isDrawingMode) return;
      e.preventDefault();
      const touch = e.touches[0];
      startDrawing({ clientX: touch.clientX, clientY: touch.clientY });
    }

    function handleTouchMove(e) {
      if (!isDrawingMode) return;
      e.preventDefault();
      const touch = e.touches[0];
      draw({ clientX: touch.clientX, clientY: touch.clientY });
    }

    // ==========================================
    // 📊 叫貨數據 前端快取與高效加載 Engine
    // ==========================================
    document.addEventListener('DOMContentLoaded', () => {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('filter-date').value = today;
      initCanvas();
      fetchCloudData();
    });

    function adjustFontSize(val) {
      document.getElementById('font-size-val').innerText = `${val}px`;
      document.documentElement.style.setProperty('--custom-font-size', `${val}px`);
    }

    function updateTimestamp() {
      const now = new Date();
      document.getElementById('print-timestamp').innerText = now.toLocaleString('zh-TW', { hour12: false });
    }

    // 🌟 核心優化：引入快取機制，載入過一次後切換選項皆為 0 延遲
    async function fetchCloudData(forceRefresh = false) {
      const container = document.getElementById('data-container');

      if (!forceRefresh && rawDataCache !== null) {
        renderData();
        return;
      }

      container.innerHTML = '<div class="col-span-full bg-white p-8 rounded-xl text-center text-slate-400 border">正在同步雲端資料，請稍候...</div>';

      try {
        const res = await fetch(`${API_URL}?t=${Date.now()}`);
        const result = await res.json();
        
        // 將資料先做一次基礎解析優化後存入記憶體快取
        const list = result.data || [];
        rawDataCache = list.map(item => {
          const parsed = parseShiftInfo(item.updatedAt, item.store);
          
          // 預先對齊門市
          let rawStore = item.store || '';
          let cleanRawStore = rawStore.replace(/\(下午\)|\(打烊\)/g, '').trim();
          let matchedStore = TARGET_STORES.find(target => {
            let cleanTarget = target.split('(')[0].trim();
            return cleanRawStore.includes(cleanTarget) || cleanTarget.includes(cleanRawStore);
          });

          return { ...item, parsed, matchedStore };
        });

        renderData();
      } catch (err) {
        container.innerHTML = '<div class="col-span-full bg-white p-8 rounded-xl text-center text-red-500 border">資料載入失敗，請檢查網路連線。</div>';
      }
    }

    function parseShiftInfo(dateStr, storeStr) {
      if (!dateStr) return { shiftName: '下午' };
      const parts = dateStr.split(' ');
      const timePart = parts[1] || '';

      let shiftName = '下午';
      if ((storeStr && storeStr.includes('打烊')) || (dateStr && dateStr.includes('打烊'))) {
        shiftName = '打烊';
      } else if ((storeStr && storeStr.includes('下午')) || (dateStr && dateStr.includes('下午'))) {
        shiftName = '下午';
      } else if (timePart && timePart.includes(':')) {
        const hour = parseInt(timePart.split(':')[0], 10);
        if (!isNaN(hour)) {
          shiftName = (hour >= 18) ? '打烊' : '下午';
        }
      }
      return { shiftName };
    }

    function isPriorityCategory(categoryStr) {
      if (!categoryStr) return false;
      const cleanCat = String(categoryStr).trim();
      return cleanCat.includes('甜品') || cleanCat.includes('冷藏');
    }

    // 🌟 極速渲染：只對快取資料進行 O(N) 輕量過濾
    function renderData() {
      updateTimestamp();
      if (!rawDataCache) return;

      const selectedDate = document.getElementById('filter-date').value;
      const selectedShift = document.getElementById('filter-shift').value;
      const selectedStore = document.getElementById('filter-store').value;
      const container = document.getElementById('data-container');

      document.getElementById('summary-date').innerText = selectedDate || '全部日期';
      document.getElementById('summary-shift').innerText = selectedShift ? `${selectedShift}時段` : '全部時段';

      // 初始化門市 HashMap
      const storeDataMap = {};
      TARGET_STORES.forEach(store => storeDataMap[store] = {});

      // 高效過濾：只過濾當日與當前時段資料
      for (let i = 0; i < rawDataCache.length; i++) {
        const item = rawDataCache[i];
        
        // 1. 日期過濾
        if (selectedDate && (!item.updatedAt || !item.updatedAt.startsWith(selectedDate))) {
          continue;
        }

        // 2. 時段過濾
        if (selectedShift && item.parsed.shiftName !== selectedShift) {
          continue;
        }

        // 3. 歸類門市數據
        if (item.matchedStore) {
          const itemName = item.itemName || '未知名稱';
          const qty = parseInt(item.quantity, 10) || 0;
          const category = item.category || '';

          if (!storeDataMap[item.matchedStore][itemName]) {
            storeDataMap[item.matchedStore][itemName] = { qty, category };
          } else {
            storeDataMap[item.matchedStore][itemName].qty += qty;
            if (!storeDataMap[item.matchedStore][itemName].category && category) {
              storeDataMap[item.matchedStore][itemName].category = category;
            }
          }
        }
      }

      container.innerHTML = '';

      let displayStores = TARGET_STORES;
      if (selectedStore) {
        displayStores = TARGET_STORES.filter(s => s === selectedStore);
      }

      displayStores.forEach(storeName => {
        const itemsObj = storeDataMap[storeName] || {};
        let itemNames = Object.keys(itemsObj);

        // 「甜品冷藏食材」優先置頂排序
        itemNames.sort((a, b) => {
          const isAPriority = isPriorityCategory(itemsObj[a].category);
          const isBPriority = isPriorityCategory(itemsObj[b].category);

          if (isAPriority && !isBPriority) return -1;
          if (!isAPriority && isBPriority) return 1;
          return 0;
        });

        const storeCard = document.createElement('div');
        storeCard.className = 'print-card bg-white rounded border border-slate-300 overflow-hidden shadow-sm flex flex-col justify-between';

        let rowsHtml = '';
        if (itemNames.length === 0) {
          rowsHtml = `<tr><td colspan="3" class="text-center text-slate-400 py-2">無叫貨紀錄</td></tr>`;
        } else {
          rowsHtml = itemNames.map((itemName, idx) => {
            const itemData = itemsObj[itemName];
            const isPriority = isPriorityCategory(itemData.category);
            const rowClass = isPriority ? 'bg-amber-100/70 print:bg-transparent font-black text-amber-950' : '';

            return `
              <tr class="border-b last:border-0 border-slate-200 ${rowClass}">
                <td class="text-center text-slate-400">${idx + 1}</td>
                <td class="font-bold text-slate-800 break-all">${itemName}</td>
                <td class="text-right font-black text-indigo-700 pr-1">${itemData.qty}</td>
              </tr>
            `;
          }).join('');
        }

        storeCard.innerHTML = `
          <div>
            <div class="bg-slate-800 text-white px-1.5 py-0.5 flex justify-between items-center print:bg-slate-900">
              <span class="font-bold dynamic-store-title truncate">🏪 ${storeName}</span>
              <span class="text-[9px] bg-slate-700 px-1 rounded text-slate-200">${itemNames.length}項</span>
            </div>
            <table class="dynamic-text-table w-full text-left">
              <thead>
                <tr class="bg-slate-100 text-slate-600 border-b border-slate-300 font-bold">
                  <th class="text-center w-4">#</th>
                  <th>品項名稱</th>
                  <th class="text-right pr-1 w-8">數量</th>
                </tr>
              </thead>
              <tbody>
                ${rowsHtml}
              </tbody>
            </table>
          </div>
        `;

        container.appendChild(storeCard);
      });
    }
  </script>
</body>
</html>
