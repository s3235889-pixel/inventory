        margin: 0 !important;
        padding: 0 !important;
      }
      .print-grid {

      .print-shortage-label {
        display: inline-block !important;
        font-weight: bold;
        font-size: 9px;
      }
    }

    .print-shortage-label {
      display: none;
    }

    .dynamic-text-table th, 
    .dynamic-text-table td {
      font-size: var(--custom-font-size) !important;
      padding: calc(var(--custom-font-size) * 0.1 + 1px) calc(var(--custom-font-size) * 0.12 + 1px) !important;

    .dynamic-store-title {

      border-color: #10b981 !important;
    }
    .store-card-completed:hover {
      opacity: 0.85 !important;

  <script>
    const SUPABASE_URL = 'https://rjetwgrelmvciatouwiw.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_Zvf4B53wK4tXQAIWOGiaYQ_KSxVO5MZ';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 🌟 指定 6 大門市自訂預設順序：潮州 -> 木崎 -> 東港 -> 萬丹 -> 仁愛 -> 屏東
    const TARGET_STORES = [
      '潮州店(C1)', 
      '木崎(C2)', 
      '東港店(D)',
      '萬丹店(W)',
      '仁愛店(P2)', 
      '屏東店(P1)'
    ];

    // 當前已勾選要顯示的門市（預設全部選取）
    let selectedStoresSet = new Set(TARGET_STORES);

    function getStoreWeight(storeName) {
      for (let i = 0; i < TARGET_STORES.length; i++) {
        if (storeName.includes(TARGET_STORES[i]) || TARGET_STORES[i].includes(storeName)) {
          return i + 1;
        }
      }
      return 99;
    }

    let currentDailyData = [];
    let currentMonthlyRawData = [];
    let currentManageData = [];
    let categoriesList = [];
    let allItemsList = [];
    let allStoresList = [];

    (async () => {
      const now = new Date();
      const today = now.toISOString().split('T')[0];
      const currentMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
      
      document.getElementById('filter-date').value = today;
      document.getElementById('manage-filter-date').value = today;
      document.getElementById('filter-month').value = currentMonth;

      renderStoreCheckboxes();
      await loadBaseDropdowns();
      await fetchDailyData();
    })();

    // 🌟 渲染門市勾選盒 UI
    function renderStoreCheckboxes() {
      const group = document.getElementById('store-checkbox-group');
      if (!group) return;
      group.innerHTML = '';

      TARGET_STORES.forEach(storeName => {
        const isChecked = selectedStoresSet.has(storeName);
        const label = document.createElement('label');
        label.className = `flex items-center gap-1 px-2 py-1 rounded-lg border cursor-pointer font-bold transition-all ${
          isChecked ? 'bg-indigo-50 border-indigo-300 text-indigo-700 shadow-sm' : 'bg-slate-50 border-slate-200 text-slate-400'
        }`;
        label.innerHTML = `
          <input type="checkbox" value="${storeName}" ${isChecked ? 'checked' : ''} onchange="handleStoreCheckboxChange(this)" class="w-3.5 h-3.5 accent-indigo-600 rounded">
          <span>${storeName}</span>
        `;
        group.appendChild(label);
      });
    }

    function handleStoreCheckboxChange(checkbox) {
      const storeName = checkbox.value;
      if (checkbox.checked) {
        selectedStoresSet.add(storeName);
      } else {
        selectedStoresSet.delete(storeName);
      }
      renderStoreCheckboxes();
      renderDailyData();
      renderMonthlyMatrixTable();
    }

    function toggleAllStores(selectAll) {
      if (selectAll) {
        selectedStoresSet = new Set(TARGET_STORES);
      } else {
        selectedStoresSet.clear();
      }
      renderStoreCheckboxes();
      renderDailyData();
      renderMonthlyMatrixTable();
    }

    function switchMainTab(tab) {
      const btnDaily = document.getElementById('btn-tab-daily');
      const btnManage = document.getElementById('btn-tab-manage');
      const btnMonthly = document.getElementById('btn-tab-monthly');
      
      const secDaily = document.getElementById('tab-daily-content');
      const secManage = document.getElementById('tab-manage-content');
      const secMonthly = document.getElementById('tab-monthly-content');

      const normalClass = 'px-3.5 py-2 text-xs font-bold rounded-lg text-slate-300 hover:bg-slate-700 transition';
      const activeClass = 'px-3.5 py-2 text-xs font-bold rounded-lg bg-indigo-600 text-white transition shadow';

      btnDaily.className = normalClass;
      btnManage.className = normalClass;
      btnMonthly.className = normalClass;

      secDaily.classList.add('hidden');
      secManage.classList.add('hidden');
      secMonthly.classList.add('hidden');

      if (tab === 'daily') {
        btnDaily.className = activeClass;
        secDaily.classList.remove('hidden');
      } else if (tab === 'manage') {
        btnManage.className = activeClass;
        secManage.classList.remove('hidden');
        fetchManageOrders();
      } else if (tab === 'monthly') {
        btnMonthly.className = activeClass;
        secMonthly.classList.remove('hidden');
        loadMonthlyData();
      }
    }

    async function loadBaseDropdowns() {
      const [catRes, storeRes, itemRes] = await Promise.all([
        supabaseClient.from('categories').select('*').order('priority', { ascending: true }),
        supabaseClient.from('stores').select('store_id,store_name,sort_order'),
        supabaseClient.from('items').select('item_id, item_name, store_id')
      ]);

      categoriesList = catRes.data || [];
      allStoresList = (storeRes.data || []).sort((a, b) => getStoreWeight(a.store_name) - getStoreWeight(b.store_name));
      allItemsList = itemRes.data || [];

      const selectMonthlyCat = document.getElementById('filter-monthly-category');
      if (selectMonthlyCat) {
        selectMonthlyCat.innerHTML = '<option value="">全部類別</option>';
        categoriesList.forEach(c => {
          selectMonthlyCat.innerHTML += `<option value="${c.category_name}">${c.category_name}</option>`;
        });
      }

      const modalStore = document.getElementById('modal-order-store');
      if (modalStore) {
        modalStore.innerHTML = '';
        allStoresList.forEach(s => {
          modalStore.innerHTML += `<option value="${s.store_id}">${s.store_name}</option>`;
        });
      }
    }

    function adjustFontSize(val) {
      document.getElementById('font-size-val').innerText = `${val}px`;
      document.documentElement.style.setProperty('--custom-font-size', `${val}px`);
    }

    function updateTimestamp() {
      const now = new Date();
      document.getElementById('print-timestamp').innerText = now.toLocaleString('zh-TW', { hour12: false });
    }

    // ==========================================
    // 1. 每日出貨總表邏輯
    // ==========================================
    function updateStoreCardCompletionState(cardElement) {
      if (!cardElement) return;
      const checkboxes = cardElement.querySelectorAll('.item-check-input');
      const badge = cardElement.querySelector('.store-completed-badge');

      if (checkboxes.length > 0) {
        const allChecked = Array.from(checkboxes).every(cb => cb.checked);
        if (allChecked) {
          cardElement.classList.add('store-card-completed');
          if (badge) badge.classList.remove('hidden');
        } else {
          cardElement.classList.remove('store-card-completed');
          if (badge) badge.classList.add('hidden');
        }
      }
    }

    async function toggleRowCheck(checkbox, orderItemId) {
      const row = checkbox.closest('tr');
      const storeCard = checkbox.closest('.print-card');
      const isChecked = checkbox.checked;

      if (isChecked) {
        row.classList.add('row-checked');
      } else {
        row.classList.remove('row-checked');
      }

      updateStoreCardCompletionState(storeCard);

      if (orderItemId) {
        await supabaseClient
          .from('order_items')
          .update({ is_checked: isChecked })
          .eq('order_item_id', orderItemId);
      }
    }

    async function handleShortageQtyChange(selectEl, orderItemId, orderedQty) {
      const row = selectEl.closest('tr');
      const printLabel = row.querySelector('.print-shortage-label');
      const shortQty = parseInt(selectEl.value, 10) || 0;

      let actualQty = Math.max(0, orderedQty - shortQty);
      let note = '';

      if (shortQty === 0) {
        actualQty = orderedQty;
        note = '正常';
        selectEl.className = 'shortage-select bg-white border border-emerald-300 rounded text-[10px] p-0.5 font-bold text-emerald-600 focus:outline-none cursor-pointer';
        row.classList.remove('row-shortage');
        if (printLabel) printLabel.innerText = '';
      } else {
        note = `缺${shortQty}(實出${actualQty})`;
        selectEl.className = 'shortage-select bg-rose-50 border border-rose-400 rounded text-[10px] p-0.5 font-black text-rose-600 focus:outline-none cursor-pointer';
        row.classList.add('row-shortage');
        if (printLabel) printLabel.innerText = `[缺${shortQty}]`;
      }

      if (orderItemId) {
        await supabaseClient
          .from('order_items')
          .update({
            actual_quantity: actualQty,
            note: note
          })
          .eq('order_item_id', orderItemId);
      }
    }

    async function fetchDailyData() {
      const container = document.getElementById('daily-data-container');
      const selectedDate = document.getElementById('filter-date').value;
      const selectedShift = document.getElementById('filter-shift').value;

      container.innerHTML = '<div class="col-span-full bg-white p-8 rounded-xl text-center text-slate-400 border">正在透過 Supabase 加載數據...</div>';

      try {
        let query = supabaseClient
          .from('order_items')
          .select(`
            order_item_id,
            quantity,
            actual_quantity,
            note,
            is_checked,
            orders!inner (
              order_date,
              shift,
              stores!inner ( store_name, sort_order )
            ),
            items!inner (
              item_name,
              categories!inner ( category_name, priority )
            )
          `)
          .eq('orders.order_date', selectedDate);

        if (selectedShift) {
          query = query.eq('orders.shift', selectedShift);
        }

        const { data, error } = await query;
        if (error) throw error;

        currentDailyData = data || [];
        renderDailyData();
      } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="col-span-full bg-white p-8 rounded-xl text-center text-red-500 border">Supabase 讀取失敗: ${err.message}</div>`;
      }
    }

    function buildShortageQtySelectHTML(orderItemId, orderedQty, actualQty, note) {
      let currentShortage = 0;
      if (actualQty !== null && actualQty !== undefined && actualQty < orderedQty) {
        currentShortage = Math.max(0, orderedQty - actualQty);
      } else if (note && note.includes('缺')) {
        const match = note.match(/缺(\d+)/);
        if (match) currentShortage = parseInt(match[1], 10);
      }

      const isShort = currentShortage > 0;
      const selectClass = isShort
        ? 'shortage-select bg-rose-50 border border-rose-400 rounded text-[10px] p-0.5 font-black text-rose-600 focus:outline-none cursor-pointer'
        : 'shortage-select bg-white border border-emerald-300 rounded text-[10px] p-0.5 font-bold text-emerald-600 focus:outline-none cursor-pointer';

      let optionsHTML = '';
      optionsHTML += `<option value="0" class="text-emerald-600 font-bold" ${currentShortage === 0 ? 'selected' : ''}>正常</option>`;

      const maxShortOption = Math.max(10, orderedQty);
      for (let s = 1; s <= maxShortOption; s++) {
        const isSelected = (s === currentShortage);
        optionsHTML += `<option value="${s}" class="text-rose-600 font-bold" ${isSelected ? 'selected' : ''}>缺 ${s}</option>`;
      }

      const printText = isShort ? `[缺${currentShortage}]` : '';

      return `
        <select onchange="handleShortageQtyChange(this, ${orderItemId}, ${orderedQty})" class="${selectClass}">
          ${optionsHTML}
        </select>
        <span class="print-shortage-label text-rose-700 font-bold">${printText}</span>
      `;
    }

    function renderDailyData() {
      updateTimestamp();
      const selectedDate = document.getElementById('filter-date').value;
      const selectedShift = document.getElementById('filter-shift').value;
      const container = document.getElementById('daily-data-container');

      document.getElementById('summary-date').innerText = selectedDate || '全部日期';
      document.getElementById('summary-shift').innerText = selectedShift ? `${selectedShift}時段` : '全部時段';

      // 取得當前已勾選的門市
      const displayStores = TARGET_STORES.filter(s => selectedStoresSet.has(s));

      if (displayStores.length === 0) {
        container.innerHTML = '<div class="col-span-full bg-white p-8 rounded-xl text-center text-slate-400 border">請至少勾選一間門市以顯示資料</div>';
        return;
      }

      // 動態調整 Grid 欄位排版
      const colsCount = displayStores.length;
      container.className = `print-grid grid grid-cols-1 sm:grid-cols-2 md:grid-cols-${Math.min(3, colsCount)} lg:grid-cols-${colsCount} gap-2`;

      const storeDataMap = {};
      displayStores.forEach(store => storeDataMap[store] = []);

      currentDailyData.forEach(row => {
        const storeName = row.orders.stores.store_name;
        const matchedStore = displayStores.find(s => s.includes(storeName) || storeName.includes(s));

        if (matchedStore) {
          storeDataMap[matchedStore].push({
            orderItemId: row.order_item_id,
            itemName: row.items.item_name,
            categoryName: row.items.categories.category_name,
            priority: row.items.categories.priority,
            quantity: row.quantity,
            actualQuantity: row.actual_quantity,
            note: row.note,
            isChecked: row.is_checked
          });
        }
      });

      container.innerHTML = '';

      displayStores.forEach(storeName => {
        let itemsList = storeDataMap[storeName] || [];
        itemsList.sort((a, b) => a.priority - b.priority);

        const storeCard = document.createElement('div');
        storeCard.className = 'print-card bg-white rounded border border-slate-300 overflow-hidden shadow-sm flex flex-col justify-between transition-all duration-300';

        const isAllChecked = (itemsList.length > 0) && itemsList.every(i => i.isChecked);
        if (isAllChecked) {
          storeCard.classList.add('store-card-completed');
        }

        let rowsHtml = '';
        if (itemsList.length === 0) {
          rowsHtml = `<tr><td colspan="5" class="text-center text-slate-400 py-3">無叫貨紀錄</td></tr>`;
        } else {
          rowsHtml = itemsList.map((item, idx) => {
            const pLevel = item.priority;
            let rowClass = '';
            if (pLevel === 1) rowClass = 'bg-amber-100/70 font-black text-amber-950';
            else if (pLevel === 2) rowClass = 'bg-orange-100/70 font-bold text-orange-950';
            else if (pLevel === 3) rowClass = 'bg-sky-100/60 font-bold text-sky-950';

            const isShortage = (item.actualQuantity !== null && item.actualQuantity < item.quantity) || (item.note && item.note.includes('缺'));
            if (isShortage) rowClass += ' row-shortage';

            const checkedClass = item.isChecked ? 'row-checked' : '';
            const shortageSelectHtml = buildShortageQtySelectHTML(item.orderItemId, item.quantity, item.actualQuantity, item.note);

            return `
              <tr class="border-b last:border-0 border-slate-200 transition-colors ${rowClass} ${checkedClass}">
                <td class="text-center text-slate-400 w-3.5">${idx + 1}</td>
                <td class="font-bold text-slate-800 whitespace-nowrap leading-tight">${item.itemName}</td>
                <td class="text-center font-black text-indigo-700 w-6">${item.quantity}</td>
                <td class="text-center w-24">
                  ${shortageSelectHtml}
                </td>
                <td class="text-center w-4 no-print">
                  <input type="checkbox" ${item.isChecked ? 'checked' : ''} onchange="toggleRowCheck(this, ${item.orderItemId})" class="item-check-input w-3.5 h-3.5 accent-indigo-600 rounded cursor-pointer align-middle">
                </td>
              </tr>
            `;
          }).join('');
        }

        storeCard.innerHTML = `
          <div>
            <div class="bg-slate-800 text-white px-1.5 py-0.5 flex justify-between items-center print:bg-slate-900">
              <span class="font-bold dynamic-store-title truncate flex items-center gap-1">
                <span>🏪 ${storeName}</span>
                <span class="store-completed-badge ${isAllChecked ? '' : 'hidden'} text-[9px] bg-emerald-500 text-white px-1 rounded font-bold">已全出</span>
              </span>
              <span class="text-[9px] bg-slate-700 px-1 rounded text-slate-200">${itemsList.length}項</span>
            </div>
            <table class="dynamic-text-table w-full text-left">
              <thead>
                <tr class="bg-slate-100 text-slate-600 border-b border-slate-300 font-bold text-[10px]">
                  <th class="text-center w-3.5">#</th>
                  <th class="whitespace-nowrap">品項</th>
                  <th class="text-center w-6">叫</th>
                  <th class="text-center w-24 whitespace-nowrap">狀態</th>
                  <th class="text-center w-4 no-print">核</th>
                </tr>
              </thead>
              <tbody>
                ${rowsHtml}
              </tbody>
            </table>
          </div>
        `;

        container.appendChild(storeCard);
      });
    }

    // ==========================================
    // 2. 每日訂單明細管理邏輯 (CRUD)
    // ==========================================
    async function fetchManageOrders() {
      const tbody = document.getElementById('manage-tbody');
      const targetDate = document.getElementById('manage-filter-date').value;
      const targetStore = document.getElementById('manage-filter-store').value;
      const targetShift = document.getElementById('manage-filter-shift').value;

      tbody.innerHTML = '<tr><td colspan="10" class="text-center py-10 text-slate-400">正在加載訂單明細...</td></tr>';

      try {
        let query = supabaseClient
          .from('order_items')
          .select(`
            order_item_id,
            order_id,
            item_id,
            quantity,
            actual_quantity,
            note,
            orders!inner (
              order_id,
              order_date,
              shift,
              store_id,
              stores!inner ( store_name, sort_order )
            ),
            items!inner (
              item_id,
              item_name
            )
          `)
          .order('order_item_id', { ascending: false });

        if (targetDate) query = query.eq('orders.order_date', targetDate);
        if (targetShift) query = query.eq('orders.shift', targetShift);

        const { data, error } = await query;
        if (error) throw error;

        currentManageData = (data || []).sort((a, b) => {
          const wA = getStoreWeight(a.orders.stores.store_name);
          const wB = getStoreWeight(b.orders.stores.store_name);
          if (wA !== wB) return wA - wB;
          return b.order_item_id - a.order_item_id;
        });

        renderManageTable();
      } catch (err) {
        console.error(err);
        tbody.innerHTML = `<tr><td colspan="10" class="text-center py-10 text-red-500">讀取失敗: ${err.message}</td></tr>`;
      }
    }

    function renderManageTable() {
      const tbody = document.getElementById('manage-tbody');
      const targetStore = document.getElementById('manage-filter-store').value;
      const keyword = document.getElementById('manage-filter-keyword').value.trim().toLowerCase();

      const selectAll = document.getElementById('manage-select-all');
      if (selectAll) selectAll.checked = false;

      let filtered = currentManageData.filter(row => {
        const sName = row.orders.stores.store_name;
        const iName = row.items.item_name.toLowerCase();

        if (targetStore && !sName.includes(targetStore) && !targetStore.includes(sName)) return false;
        if (keyword && !iName.includes(keyword)) return false;
        return true;
      });

      document.getElementById('manage-record-count').innerText = `共 ${filtered.length} 筆明細`;

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="10" class="text-center py-10 text-slate-400">查無符合條件之訂單紀錄</td></tr>';
        updateManageBatchDeleteBtn();
        return;
      }

      tbody.innerHTML = filtered.map((row, idx) => {
        const actualDisplay = row.actual_quantity !== null ? `<span class="font-bold text-slate-800">${row.actual_quantity}</span>` : `<span class="text-slate-400">(同叫貨)</span>`;
        const noteDisplay = row.note ? `<span class="text-rose-600 font-bold">${row.note}</span>` : `<span class="text-slate-300">-</span>`;

        return `
          <tr class="hover:bg-slate-50 transition">
            <td class="p-3 text-center">
              <input type="checkbox" class="manage-checkbox w-4 h-4 text-indigo-600 rounded cursor-pointer align-middle" data-id="${row.order_item_id}" onchange="updateManageBatchDeleteBtn()">
            </td>
            <td class="p-3 text-center text-slate-400">${idx + 1}</td>
            <td class="p-3 font-semibold text-slate-700 whitespace-nowrap">${row.orders.order_date}</td>
            <td class="p-3 text-center font-bold text-indigo-600 whitespace-nowrap">${row.orders.shift}</td>
            <td class="p-3 font-bold text-slate-900 whitespace-nowrap">🏪 ${row.orders.stores.store_name}</td>
            <td class="p-3 font-bold text-slate-800 whitespace-nowrap">${row.items.item_name}</td>
            <td class="p-3 text-center font-black text-indigo-600 whitespace-nowrap">${row.quantity}</td>
            <td class="p-3 text-center whitespace-nowrap">${actualDisplay}</td>
            <td class="p-3 text-xs whitespace-nowrap">${noteDisplay}</td>
            <td class="p-3 text-right pr-6 space-x-1 whitespace-nowrap">
              <button onclick="editOrderRecord(${row.order_item_id})" class="px-2 py-1 text-slate-600 hover:text-indigo-600 hover:bg-indigo-50 rounded font-bold transition">✏️ 編輯</button>
              <button onclick="deleteSingleOrderItem(${row.order_item_id}, '${row.items.item_name}')" class="px-2 py-1 text-rose-500 hover:bg-rose-50 rounded font-bold transition">🗑️ 刪除</button>
            </td>
          </tr>
        `;
      }).join('');

      updateManageBatchDeleteBtn();
    }

    function toggleManageSelectAll(isChecked) {
      const checkboxes = document.querySelectorAll('.manage-checkbox');
      checkboxes.forEach(cb => cb.checked = isChecked);
      updateManageBatchDeleteBtn();
    }

    function updateManageBatchDeleteBtn() {
      const checkedBoxes = document.querySelectorAll('.manage-checkbox:checked');
      const allBoxes = document.querySelectorAll('.manage-checkbox');
      const batchBtn = document.getElementById('btn-manage-batch-delete');
      const selectAll = document.getElementById('manage-select-all');

      if (batchBtn) {
        if (checkedBoxes.length > 0) {
          batchBtn.innerText = `🗑️ 批量刪除 (${checkedBoxes.length})`;
          batchBtn.classList.remove('hidden');
        } else {
          batchBtn.classList.add('hidden');
        }
      }

      if (selectAll && allBoxes.length > 0) {
        selectAll.checked = (checkedBoxes.length === allBoxes.length);
      }
    }

    async function deleteSelectedManageItems() {
      const checkedBoxes = document.querySelectorAll('.manage-checkbox:checked');
      const selectedIds = Array.from(checkedBoxes).map(cb => parseInt(cb.getAttribute('data-id'), 10));

      if (selectedIds.length === 0) return;
      if (!confirm(`⚠️ 確定要一次刪除勾選的 ${selectedIds.length} 筆訂單明細嗎？`)) return;

      const batchBtn = document.getElementById('btn-manage-batch-delete');
      batchBtn.disabled = true;

      try {
        const { error } = await supabaseClient.from('order_items').delete().in('order_item_id', selectedIds);
        if (error) throw error;
        alert(`🎉 已成功刪除 ${selectedIds.length} 筆明細！`);
        await fetchManageOrders();
      } catch (err) {
        alert(`刪除失敗: ${err.message}`);
      } finally {
        batchBtn.disabled = false;
      }
    }

    async function deleteSingleOrderItem(orderItemId, itemName) {
      if (!confirm(`確定要刪除品項【${itemName}】這筆叫貨紀錄嗎？`)) return;
      try {
        const { error } = await supabaseClient.from('order_items').delete().eq('order_item_id', orderItemId);
        if (error) throw error;
        await fetchManageOrders();
      } catch (err) {
        alert(`刪除失敗: ${err.message}`);
      }
    }

    function loadStoreItemsForModal() {
      const storeId = document.getElementById('modal-order-store').value;
      const itemSelect = document.getElementById('modal-order-item');
      itemSelect.innerHTML = '';

      const availableItems = allItemsList.filter(i => i.store_id === null || String(i.store_id) === String(storeId));
      availableItems.sort((a, b) => a.item_name.localeCompare(b.item_name, 'zh-Hant'));

      availableItems.forEach(i => {
        itemSelect.innerHTML += `<option value="${i.item_id}">${i.item_name}${i.store_id === null ? ' (共通)' : ''}</option>`;
      });
    }

    function openAddOrderModal() {
      document.getElementById('modal-order-item-id').value = '';
      document.getElementById('order-modal-title').innerText = '手動新增叫貨明細';
      document.getElementById('modal-order-date').value = document.getElementById('manage-filter-date').value || new Date().toISOString().split('T')[0];
      document.getElementById('modal-order-shift').value = '下午';
      document.getElementById('modal-order-qty').value = '1';
      document.getElementById('modal-order-actual-qty').value = '';
      document.getElementById('modal-order-note').value = '';

      loadStoreItemsForModal();
      document.getElementById('order-edit-modal').classList.remove('hidden');
    }

    function closeOrderModal() {
      document.getElementById('order-edit-modal').classList.add('hidden');
    }

    function editOrderRecord(orderItemId) {
      const row = currentManageData.find(r => r.order_item_id === orderItemId);
      if (!row) return;

      document.getElementById('modal-order-item-id').value = row.order_item_id;
      document.getElementById('order-modal-title').innerText = '編輯叫貨明細';
      document.getElementById('modal-order-date').value = row.orders.order_date;
      document.getElementById('modal-order-shift').value = row.orders.shift;
      document.getElementById('modal-order-store').value = row.orders.store_id;

      loadStoreItemsForModal();
      document.getElementById('modal-order-item').value = row.item_id;
      document.getElementById('modal-order-qty').value = row.quantity;
      document.getElementById('modal-order-actual-qty').value = row.actual_quantity !== null ? row.actual_quantity : '';
      document.getElementById('modal-order-note').value = row.note || '';

      document.getElementById('order-edit-modal').classList.remove('hidden');
    }

    async function saveOrderRecord() {
      const orderItemId = document.getElementById('modal-order-item-id').value;
      const orderDate = document.getElementById('modal-order-date').value;
      const shift = document.getElementById('modal-order-shift').value;
      const storeId = parseInt(document.getElementById('modal-order-store').value, 10);
      const itemId = parseInt(document.getElementById('modal-order-item').value, 10);
      const qty = parseInt(document.getElementById('modal-order-qty').value, 10) || 1;
      const actualQtyVal = document.getElementById('modal-order-actual-qty').value.trim();
      const actualQty = actualQtyVal !== '' ? parseInt(actualQtyVal, 10) : null;
      const note = document.getElementById('modal-order-note').value.trim();

      if (!orderDate || !storeId || !itemId) return alert('請完整填寫日期、門市與商品！');

      try {
        if (orderItemId) {
          await supabaseClient
            .from('order_items')
            .update({
              item_id: itemId,
              quantity: qty,
              actual_quantity: actualQty,
              note: note
            })
            .eq('order_item_id', orderItemId);
        } else {
          let { data: existingOrder } = await supabaseClient
            .from('orders')
            .select('order_id')
            .eq('store_id', storeId)
            .eq('order_date', orderDate)
            .eq('shift', shift)
            .maybeSingle();

          let orderId = existingOrder ? existingOrder.order_id : null;

          if (!orderId) {
            const { data: newOrder, error: oErr } = await supabaseClient
              .from('orders')
              .insert({ store_id: storeId, order_date: orderDate, shift: shift })
              .select();
            if (oErr) throw oErr;
            orderId = newOrder[0].order_id;
          }

          const { error: oiErr } = await supabaseClient
            .from('order_items')
            .insert({
              order_id: orderId,
              item_id: itemId,
              quantity: qty,
              actual_quantity: actualQty,
              note: note,
              is_checked: false
            });
          if (oiErr) throw oiErr;
        }

        closeOrderModal();
        await fetchManageOrders();
        alert('🎉 訂單資料儲存成功！');
      } catch (err) {
        alert(`儲存失敗: ${err.message}`);
      }
    }

    // ==========================================
    // 3. 每月實出統計邏輯
    // ==========================================
    async function loadMonthlyData() {
      const monthStr = document.getElementById('filter-month').value;
      const tbody = document.getElementById('matrix-tbody');
      tbody.innerHTML = '<tr><td colspan="10" class="text-center py-10 text-slate-400">正在統計月度數據...</td></tr>';

      if (!monthStr) return;

      const [year, month] = monthStr.split('-');
      const startDate = `${year}-${month}-01`;
      const lastDay = new Date(year, month, 0).getDate();
      const endDate = `${year}-${month}-${String(lastDay).padStart(2, '0')}`;

      try {
        const { data, error } = await supabaseClient
          .from('order_items')
          .select(`
            order_item_id,
            quantity,
            actual_quantity,
            note,
            orders!inner (
              order_date,
              stores!inner ( store_name )
            ),
            items!inner (
              item_name,
              categories ( category_name, priority )
            )
          `)
          .gte('orders.order_date', startDate)
          .lte('orders.order_date', endDate);

        if (error) throw error;

        currentMonthlyRawData = data || [];
        renderMonthlyMatrixTable();

      } catch (err) {
        console.error('統計載入失敗:', err);
        tbody.innerHTML = `<tr><td colspan="10" class="text-center py-10 text-red-500">載入失敗: ${err.message}</td></tr>`;
      }
    }

    function renderMonthlyMatrixTable() {
      const selectedCat = document.getElementById('filter-monthly-category').value;
      const searchKeyword = document.getElementById('filter-monthly-keyword').value.trim().toLowerCase();
      const tbody = document.getElementById('matrix-tbody');
      const tfoot = document.getElementById('matrix-tfoot');
      const headerRow = document.getElementById('matrix-header-row');

      // 取得當前已勾選的門市
      const displayStores = TARGET_STORES.filter(s => selectedStoresSet.has(s));

      // 動態更新表頭
      if (headerRow) {
        let headersHtml = `
          <th class="p-3 w-12 text-center border-r">#</th>
          <th class="p-3 w-48 border-r whitespace-nowrap">商品名稱</th>
          <th class="p-3 w-28 border-r whitespace-nowrap">商品分類</th>
        `;
        displayStores.forEach(s => {
          headersHtml += `<th class="p-3 text-center border-r text-indigo-800 bg-indigo-50/50 whitespace-nowrap">${s}</th>`;
        });
        headersHtml += `<th class="p-3 text-center bg-amber-50 text-amber-900 font-black whitespace-nowrap">合計實出</th>`;
        headerRow.innerHTML = headersHtml;
      }

      if (displayStores.length === 0) {
        tbody.innerHTML = '<tr><td colspan="10" class="text-center py-10 text-slate-400">請勾選至少一間門市以進行月度統計</td></tr>';
        tfoot.innerHTML = '';
        return;
      }

      let totalActualSum = 0;
      let totalOrderedSum = 0;
      let totalShortageSum = 0;

      const itemMap = {};

      currentMonthlyRawData.forEach(row => {
        const itemName = row.items.item_name;
        const categoryName = row.items.categories?.category_name || '未分類';
        const priority = row.items.categories?.priority || 4;
        const rawStoreName = row.orders.stores.store_name;
        
        const matchedStore = displayStores.find(s => s.includes(rawStoreName) || rawStoreName.includes(s));
        if (!matchedStore) return;

        const orderedQty = parseInt(row.quantity, 10) || 0;
        let actualQty = orderedQty;
        if (row.actual_quantity !== null && row.actual_quantity !== undefined) {
          actualQty = parseInt(row.actual_quantity, 10);
        } else if (row.note && row.note.includes('缺')) {
          const match = row.note.match(/缺(\d+)/);
          if (match) actualQty = Math.max(0, orderedQty - parseInt(match[1], 10));
        }

        const shortageQty = Math.max(0, orderedQty - actualQty);
        totalActualSum += actualQty;
        totalOrderedSum += orderedQty;
        totalShortageSum += shortageQty;

        if (!itemMap[itemName]) {
          itemMap[itemName] = {
            categoryName: categoryName,
            priority: priority,
            stores: {},
            totalActual: 0,
            totalOrdered: 0
          };
          displayStores.forEach(s => itemMap[itemName].stores[s] = 0);
        }

        itemMap[itemName].stores[matchedStore] = (itemMap[itemName].stores[matchedStore] || 0) + actualQty;
        itemMap[itemName].totalActual += actualQty;
        itemMap[itemName].totalOrdered += orderedQty;
      });

      document.getElementById('stat-total-actual').innerText = totalActualSum.toLocaleString();
      document.getElementById('stat-total-ordered').innerText = totalOrderedSum.toLocaleString();
      document.getElementById('stat-total-shortage').innerText = totalShortageSum.toLocaleString();

      let itemsList = Object.keys(itemMap).map(name => ({
        itemName: name,
        ...itemMap[name]
      }));

      if (selectedCat) itemsList = itemsList.filter(i => i.categoryName === selectedCat);
      if (searchKeyword) itemsList = itemsList.filter(i => i.itemName.toLowerCase().includes(searchKeyword));

      itemsList.sort((a, b) => {
        if (a.priority !== b.priority) return a.priority - b.priority;
        return a.itemName.localeCompare(b.itemName, 'zh-Hant');
      });

      if (itemsList.length === 0) {
        tbody.innerHTML = '<tr><td colspan="10" class="text-center py-10 text-slate-400">該月份查無出貨數據</td></tr>';
        tfoot.innerHTML = '';
        return;
      }

      const storeColumnSums = {};
      displayStores.forEach(s => storeColumnSums[s] = 0);
      let grandTotalActual = 0;

      tbody.innerHTML = itemsList.map((item, idx) => {
        displayStores.forEach(s => {
          storeColumnSums[s] += (item.stores[s] || 0);
        });
        grandTotalActual += item.totalActual;

        const storeColsHtml = displayStores.map(s => {
          const qty = item.stores[s] || 0;
          const displayVal = qty > 0 ? `<span class="font-bold text-slate-800">${qty}</span>` : `<span class="text-slate-300">-</span>`;
          return `<td class="p-3 text-center border-r whitespace-nowrap">${displayVal}</td>`;
        }).join('');

        return `
          <tr class="hover:bg-indigo-50/40 transition">
            <td class="p-3 text-center text-slate-400 border-r">${idx + 1}</td>
            <td class="p-3 font-bold text-slate-900 border-r whitespace-nowrap">${item.itemName}</td>
            <td class="p-3 text-slate-500 border-r whitespace-nowrap">${item.categoryName}</td>
            ${storeColsHtml}
            <td class="p-3 text-center font-black text-indigo-700 bg-amber-50/50 whitespace-nowrap">${item.totalActual}</td>
          </tr>
        `;
      }).join('');

      const footStoreCols = displayStores.map(s => {
        return `<td class="p-3 text-center border-r text-slate-900 font-black whitespace-nowrap">${storeColumnSums[s]}</td>`;
      }).join('');

      tfoot.innerHTML = `
        <tr>
          <td colspan="3" class="p-3 text-right pr-4 border-r font-bold text-slate-700 whitespace-nowrap">各店實際出貨總計：</td>
          ${footStoreCols}
          <td class="p-3 text-center font-black text-indigo-900 bg-amber-100 text-sm whitespace-nowrap">${grandTotalActual}</td>
        </tr>
      `;
    }

    function exportToCSV() {
      const monthStr = document.getElementById('filter-month').value || 'monthly_report';
      const displayStores = TARGET_STORES.filter(s => selectedStoresSet.has(s));

      let csvContent = '\uFEFF';
      csvContent += `品項名稱,商品分類,${displayStores.join(',')},合計實出\n`;

      const rows = document.querySelectorAll('#matrix-tbody tr');
      rows.forEach(tr => {
        const cols = tr.querySelectorAll('td');
        if (cols.length >= (displayStores.length + 4)) {
          const rowData = [
            `"${cols[1].innerText.trim()}"`,
            `"${cols[2].innerText.trim()}"`
          ];
          for (let i = 0; i < displayStores.length; i++) {
            rowData.push(cols[3 + i].innerText.trim().replace('-', '0'));
          }
          rowData.push(cols[3 + displayStores.length].innerText.trim());
          csvContent += rowData.join(',') + '\n';
        }
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', `各門市出貨量統計_${monthStr}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</template>
