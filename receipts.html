<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>帳條上傳｜門市結帳</title><link rel="stylesheet" href="receipts.css"></head><body><main><nav><a href="index.html">← 叫貨系統</a></nav><header><small>門市每日結帳</small><h1>帳條上傳</h1><p>早班、晚班各一筆，拍照後填入營收與支出。</p></header><section id="login"><h2>選擇分店</h2><form id="login-form"><label>分店<select id="store" required><option value="">載入中…</option></select></label><label>分店密碼<input id="password" type="password" autocomplete="current-password" required></label><button>登入</button></form></section><section id="workspace" hidden><div class="row"><h2 id="store-name"></h2><button id="logout" class="secondary" type="button">切換分店</button></div><p id="today"></p><div id="status" class="status" aria-live="polite"></div><p id="edit-note" class="muted" hidden>正在編輯當天帳條。未選擇新照片時保留原照片；儲存後需由主管重新確認。</p><button id="edit" type="button" class="secondary" hidden>編輯這個班別</button><form id="receipt-form"><label>班別<select id="shift" required><option>早班</option><option>晚班</option></select></label><div class="revenue-grid"><label><span id="revenue-label">早班總營收（元）</span><input name="revenue" type="number" min="0" max="9999999999.99" step="0.01" inputmode="decimal" required></label><label>熊貓營收（元）<input name="foodpanda_revenue" type="number" min="0" max="9999999999.99" step="0.01" inputmode="decimal" placeholder="無營收請填 0" required></label><label>Uber 營收（元）<input name="uber_revenue" type="number" min="0" max="9999999999.99" step="0.01" inputmode="decimal" placeholder="無營收請填 0" required></label><label>現金營收（元）<input name="cash_revenue" type="number" min="0" max="9999999999.99" step="0.01" inputmode="decimal" placeholder="無營收請填 0" required></label><label>支出總額（元）<input name="expense" type="number" min="0" max="9999999999.99" step="0.01" inputmode="decimal" value="0" required></label></div><label>帳條照片<input id="photo" type="file" accept="image/*" required></label><p class="muted">可拍照或從相簿選取。照片會自動縮小；請確認數字清楚。</p><img id="preview" alt="帳條預覽" hidden><button id="submit">確認上傳</button></form></section><p id="message" role="status" aria-live="polite"></p></main><script src="receipts.js?v=shift-label-20261022"></script></body></html>
